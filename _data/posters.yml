  - title: Addressing Fairness and Trustworthiness in The Workplace Using Scalable
      Blockchain Survey Solutions
    submission_id: 57
    pdf: sorted_papers/Poster/Student%20-%20Graduate/ADMI_2026_paper_57.pdf
    bib: admi2026_bib/Kabia2026addressingfairnesstrustw.bib
    submission_type: Poster
    author_category: Student - Graduate
    authors: Hamid Kabia, Blayne Montaque and Saurav Aryal
    abstract: Fairness and trustworthiness are principles that were implemented into
      the workplace to allow for the growth of a more competitive career marketplace
      in which all individuals have equal opportunity at a role regardless of external
      matters such as race, religion, gender, or sexuality [1]. However, despite the
      positive impacts these initiatives have had in the work place, in recent years
      there&#x27;s been a push back against them. With multiple organizations even
      going as far as rolling back their programs supporting fairness in the workplace.
      To combat this we have developed a tool that allows for anonymous insider reporting
      of a company’s policies through the blockchain. Through the use of this tool
      we hope to allow consumers and potential jobseekers to make informed decisions
      about the companies they patronize.
