  - title: 'PeerConnect: Optimizing Peer Tutoring with Predictive Analytics and Intelligent
      Matching'
    submission_id: 11
    pdf: sorted_papers/Poster/Student%20-%20Undergraduate/ADMI_2026_paper_11.pdf
    bib: admi2026_bib/Oluwaseyitan2026peerconnectoptimizingpee.bib
    submission_type: Poster
    author_category: Student - Undergraduate
    authors: Teniola Oluwaseyitan
    abstract: Abstract PeerConnect is an advanced mobile application designed to enhance
      academic support and peer-led learning by connecting students with compatible
      tutors based on their strengths, learning needs, and performance data. Addressing
      the challenges students face in finding effective academic assistance, the platform
      leverages predictive analytics and intelligent matching algorithms to recommend
      the most suitable tutors, optimize session scheduling, and monitor student progress,
      creating a personalized and data-driven learning experience. The application
      incorporates features such as user registration, detailed tutor profiles with
      performance statistics, progress tracking dashboards, session scheduling with
      conflict detection, and AI-driven recommendations for study materials and tutors.
      Built as an iOS application using Swift with a Python-powered backend and MySQL
      database, PeerConnect prioritizes accessibility, user experience, and responsive
      design, making it suitable for students across diverse academic disciplines.
      By integrating mathematical concepts such as weighted scoring, regression analysis,
      graph-based network modeling, and predictive probability, PeerConnect not only
      strengthens the peer tutoring process but also provides measurable insights
      into student performance and learning outcomes. The platform fosters a culture
      of collaborative learning, academic improvement, and knowledge sharing, offering
      a structured, reliable, and scalable alternative to informal or traditional
      tutoring services. PeerConnect ultimately aims to enhance student academic performance,
      engagement, and retention by providing a robust, technology-driven peer support
      system. Future development may expand AI-driven analytics, subject coverage,
      and integration with institutional learning management systems, highlighting
      the transformative potential of math-informed, data-driven educational technology
      in higher education
  - title: Deep Learning in Network Traffic Analysis Using Synthetic Data for Privacy
      Protection and Cyber Attack Mitigation
    submission_id: 14
    pdf: sorted_papers/Poster/Student%20-%20Undergraduate/ADMI_2026_paper_14.pdf
    bib: admi2026_bib/Neupane2026deeplearningnetwork.bib
    submission_type: Poster
    author_category: Student - Undergraduate
    authors: Swikriti Neupane and Pratap Sahu
    abstract: 'Intrusion Detection Systems (IDS) are important for identifying malicious
      network activity, but they rely heavily on large, labeled datasets for effective
      training. A major challenge in this field is that real network data often contains
      Personally Identifiable Information (PII), such as IP addresses and hostnames,
      creating significant privacy and security risks. This research aims to develop
      a pipeline that removes PII from network datasets while maintaining their research
      utility. The objective is to generate high-quality synthetic datasets that enable
      secure data sharing for IDS without compromising sensitive information. The
      study utilized the CIC-IDS-2017 dataset to reflect authentic network activity
      and diverse cyberattack types. The methodology involved a multi-stage process:
      first, PII detection was performed using pattern-matching for IPs, MAC addresses,
      and URLs. This was followed by anonymization through tokenization (e.g., replacing
      IPs with coded labels) and generalization (e.g., converting specific timestamps
      to dates). Finally, synthetic data was generated using Conditional Generative
      Adversarial Networks (CTGAN). The primary goal was to create synthetic records
      that mimic the statistical distributions of the original traffic without exposing
      individual identities. The effectiveness of the synthetic data was evaluated
      across three dimensions: Utility, Diversity, and Privacy. In terms of utility,
      machine learning models trained on synthetic data achieved significant performance
      improvement compared to models trained on real data. Diversity metrics confirmed
      that the synthetic datasets maintained consistent label distributions and generated
      enough unique samples to prevent model overfitting. Finally, privacy was validated
      by measuring the distance between synthetic records and their nearest real samples.
      The results showed a significant average distance of 23,952,242.9681 and a minimum
      distance of 2,583,688.0567, indicating that the synthetic records are not direct
      copies of the original data. These findings suggest that synthetic data generation
      is a powerful tool for IDS research, enabling secure data sharing and mitigation
      of cyberattacks while ensuring total privacy protection. Future work will focus
      on exploring Graph Neural Networks (GNNs), automated end-to-end pipelines, and
      techniques to ensure fairness across rare attack classes.'
  - title: Semantic Search for Healthcare Patient Data using Sentence Transformers
      and ChromaDB
    submission_id: 15
    pdf: sorted_papers/Poster/Student%20-%20Undergraduate/ADMI_2026_paper_15.pdf
    bib: admi2026_bib/Rabb2026semanticsearchhealthcare.bib
    submission_type: Poster
    author_category: Student - Undergraduate
    authors: Megan Rabb, Shani Walker, Joniqua Bates, Nikunja Swain, Biswajit Biswal,
      Janmejay Mohanty and Xiaomao Liu
    abstract: Healthcare systems often store large volumes of patient records in formats
      that are difficult to search efficiently using traditional keyword-based methods.
      These limitations can delay care, frustrate providers, and impact outcomes.
      A solution is needed that understands the context and meaning behind clinical
      documentation, enabling faster and more intelligent access to related cases.
      Semantic search is changing the way we manage healthcare information by helping
      us understand the meaning behind patient records instead of just looking for
      exact words. In this project, we used Google Colab to build a simple but powerful
      semantic search system that combines Sentence Transformers and ChromaDB. The
      goal was to make it easier to find similar patient cases or notes based on meaning.
      We used a pre-trained transformer model (&quot;all-MiniLM-L6-v2&quot;) to turn
      sentences about patient data into numerical vectors. These vectors were saved
      and searched using ChromaDB, a lightweight vector database. All coding and testing
      were done in Google Colab. For example, when we searched for &quot;high blood
      pressure treatment,&quot; the system returned a sentence about &quot;medication
      for hypertension&quot; - proving that it could understand medical terms even
      if they were worded differently. This kind of system can make it easier for
      doctors or medical staff to find relevant records quickly, especially in electronic
      health record systems. Overall, this project shows how machine learning tools
      like sentence embeddings can make healthcare data smarter and more useful.
  - title: 'Deep Learning for Skin Lesion Detection: A CNN Approach'
    submission_id: 16
    pdf: sorted_papers/Poster/Student%20-%20Undergraduate/ADMI_2026_paper_16.pdf
    bib: admi2026_bib/Swain2026deeplearningskin.bib
    submission_type: Poster
    author_category: Student - Undergraduate
    authors: Nikunja Swain, Biswajit Biswal, Xiaomao Liu, Janmejay Mohanty, Jaleel
      Johnson, Zy&#x27;Aier Frazzier and Tyler Brown
    abstract: 'Skin cancer is one of the most common and fastest-growing cancers worldwide.
      Early and accurate detection is critical to improving patient outcomes, reducing
      the need for invasive procedures, and lowering mortality rates. This project
      investigates the application of deep learning, specifically convolutional neural
      networks (CNNs), for the automatic classification of skin lesion images using
      the HAM10000 dataset. The CNN model was trained to recognize and differentiate
      between seven dermatological conditions: melanoma, basal cell carcinoma (bcc),
      benign keratosis-like lesions (bkl), actinic keratoses and intraepithelial carcinoma
      (akiec), dermatofibroma (df), melanocytic nevi (nv), and vascular lesions (vasc).
      To improve model performance and address class imbalance, preprocessing steps
      such as image normalization and data augmentation were applied. A custom batch
      data generator was also implemented to efficiently manage system memory and
      streamline training. Model development was conducted using Google Colab with
      TensorFlow and Keras, leveraging GPU acceleration for faster computation. The
      resulting CNN achieved a validation accuracy of approximately 85%, placing its
      performance within the reported dermatologist accuracy range of 62–80%. These
      results highlight the potential of AI-driven diagnostic tools in assisting with
      early skin cancer detection and supporting clinical decision-making. The model
      is especially valuable for deployment in underserved or remote areas where dermatology
      specialists may not be available. However, further validation is needed to assess
      its generalizability to real-world clinical settings, including diverse populations
      and non-dermoscopic images. With continued refinement, this system could significantly
      enhance screening, diagnosis, and treatment planning in modern dermatology.'
  - title: Cardiovascular Disease Prediction Using Machine Learning
    submission_id: 17
    pdf: sorted_papers/Poster/Student%20-%20Undergraduate/ADMI_2026_paper_17.pdf
    bib: admi2026_bib/Swain2026cardiovasculardiseasepre.bib
    submission_type: Poster
    author_category: Student - Undergraduate
    authors: Nikunja Swain, Biswajit Biswal, Xiaomao Liu, Janmejay Mohanty, Xavier
      White, Trey Newton and Blake Nichols
    abstract: Cardiovascular disease (CVD) remains one of the leading causes of death
      worldwide, posing a significant challenge to global health systems. Early detection
      and prevention are critical to reducing its impact, yet traditional diagnostic
      methods often fall short in identifying at-risk individuals before serious complications
      arise. This project focuses on developing a machine learning-based cardiovascular
      disease prediction model that can analyze key health indicators and predict
      individual risk with greater accuracy and efficiency. This aligns closely with
      the center’s mission to advance health equity through innovative, data-driven
      solutions. By combining medical knowledge with artificial intelligence, this
      work embraces the center’s commitment to improving public health outcomes, expanding
      access to preventive care, and empowering communities through technology-driven
      healthcare innovation. This project presents a machine learning-based approach
      for predicting the risk of cardiovascular disease using patient health data.
      By leveraging algorithms such as Logistic Regression, Random Forest, and Support
      Vector Machines, the system analyzes features including age, blood pressure,
      cholesterol levels, BMI, and lifestyle factors to assess cardiovascular risk.
      The dataset, preprocessed for missing values and scaled for consistency, is
      split into training and testing sets to evaluate model accuracy. Performance
      metrics such as precision, recall, and ROC-AUC scores are used to determine
      the most effective model. This predictive tool aims to support early diagnosis
      and preventive healthcare decisions, offering an accessible, data-driven method
      for identifying at-risk individuals.
  - title: Machine Learning Diagnosis of Peripheral Arterial Disease from CT-Angiography
      (CTA) Images
    submission_id: 2
    pdf: sorted_papers/Poster/Student%20-%20Undergraduate/ADMI_2026_paper_2.pdf
    bib: admi2026_bib/Singh2026machinelearningdiagnosis.bib
    submission_type: Poster
    author_category: Student - Undergraduate
    authors: Amrinder Singh, Caliese Beckford, Subash Neupane, Demi Ashade, Swikriti
      Neupane, Bimal Itani, Verlie Tisdale and Shrikant Pawar
    abstract: 'Introduction: Peripheral Arterial Disease (PAD) is a common circulatory
      problem characterized by narrowed arteries that reduce blood flow to the lower
      extremities. In 2019 the global burden of disease study attributed over 74,000
      deaths to PAD with over 113,000,000 individuals living with the condition globally.
      Despite its prevalence, accurate and timely diagnosis remains a challenge, often
      leading to severe complications such as muscular weakness, amputation etc. Study
      Objectives: This research investigates the use of machine learning specifically
      Convolutional Neural Networks (CNNs), to enhance PAD diagnosis from CT-Angiography
      (CTA) images. Methods: The study aims to determine the effectiveness of neural
      networks in detecting PAD, optimize model performance, and deploy a testing
      application for clinical use. We have generated PAD ML model by utilizing pretrained
      ResNet-50 architecture on PyTorch Framework with dataset splits of 80% training
      and 20% validation, a AdamW optimizer for 500 epochs. Results: Overall, the
      model shows stable validation performance with high accuracy, F1-score, and
      AUC. Metrics remain consistent in later epochs, and the selected checkpoint
      reflects strong generalization behavior. A validation accuracy of ~93–94%, precision
      of ~0.93–0.95, recall of ~0.91–0.94, F1-score of ~0.93, and an AUC of ~0.97–0.98
      was observed from training (Figure 1). Discussion: By improving diagnostic accuracy,
      this project has the potential to facilitate early detection and treatment of
      PAD, reducing the risk of severe outcomes. The integration of machine learning
      models into clinical workflows represents a significant step toward more accessible
      and efficient PAD diagnostics, ultimately improving patient care and outcomes.
      Figure 1: Validation Area Under the Curve (AUC) for detecting PAD. Acknowledgment:
      This study is funded by National Science Foundation South Carolina Established
      Program for Stem Cooperative Research (SC EPSCoR), AI-enabled Devices for the
      Advancement of Personalized and Transformative Healthcare in South Carolina
      ADAPT, RII Track-1, Award Number: 2242812, Claflin University Sub-awardees Tisdale
      Verlie and Pawar Shrikant.'
  - title: Enhancing Undergraduate Research Recruitment through NLP-Driven Application
      Matching
    submission_id: 26
    pdf: sorted_papers/Poster/Student%20-%20Undergraduate/ADMI_2026_paper_26.pdf
    bib: admi2026_bib/Bennett2026enhancingundergraduatere.bib
    submission_type: Poster
    author_category: Student - Undergraduate
    authors: Carl Bennett
    abstract: 'In the current academic landscape, the bridge between undergraduate
      talent and faculty research projects is often built on informal emails or static
      forms. For professors, reviewing dozens of statements of interest to find specific
      technical overlaps is time-consuming and ineffective. For students, the lack
      of transparency in opportunities and how their skills align with them can be
      a barrier to entry. This project addresses these inefficiencies by providing
      a centralized, intelligent platform that digitizes recruitment and applies computational
      linguistics to assist in decision-making. This project follows a decoupled,
      three-tier architecture designed for scalability and separation of concerns.
      The frontend utilizes React.js for a dynamic User Interface (UI) that provides
      role-based dashboards. It handles state management for real-time application
      tracking and provides a responsive environment for both students and professors/Principal
      Investigators. The core of the project lies in the backend API, constructed
      with the Django REST Framework. Django manages the authentication logic, serves
      as the API gateway, and hosts the Machine Learning (ML) utility scripts. The
      relational database, MySQL, was chosen for its ACID compliance. This ensures
      that sensitive student data and application records remain consistent and secure.
      The core feature of this portal is the integration of the scikit-learn library
      to perform semantic analysis on text data. The matching process follows a three-stage
      pipeline: Pre-processing, Vectorization, and Similarity Scoring. To compare
      a professor&#x27;s project description with a student&#x27;s statement and Resume,
      the text must be converted into numerical vectors. This is accomplished by using
      Term Frequency-Inverse Document Frequency (TF-IDF) Where tf_{t,d} is the frequency
      of term t in document d, and the second term is the Inverse Document Frequency,
      which penalizes common words (like &quot;the&quot; or &quot;and&quot;) while
      rewarding specific technical terms (like &quot;Python&quot; or &quot;Microbiology&quot;).
      Once the text is vectorized, the Cosine Similarity (2) is calculated to determine
      the distance between the two vectors. This measures the cosine of the angle
      between them in a high dimensional space. A score of 1.0 (100%) indicates a
      perfect keyword alignment, while 0.0 indicates no overlap. This project implements
      several key features to enhance the user experience. By using Role-Based Access
      Control, Users are automatically directed to either the Student or Professor
      dashboard upon login. Keywords in a student&#x27;s statement of interest or
      resume are highlighted using the TF-IDF feature names. The system identifies
      the top 5 overlapping terms between the student and the project, providing a
      quick, at-a-glance description of student suitability. Applications can be sorted
      by their keyword alignment immediately, allowing professors to prioritize the
      most relevant candidates. By moving beyond manual review and adopting NLP-driven
      matching, this project reduces the administrative friction in undergraduate
      research. Future iterations of this work aim to incorporate Large Language Models
      (LLMs) such as Gemini or GPT-4 to provide nuanced summaries of student applications
      and support multilingual sentiment analysis for interdisciplinary projects.'
  - title: AI-Enabled Construction of Aligned Collagen Using Two-Photon Techniques
    submission_id: 3
    pdf: sorted_papers/Poster/Student%20-%20Undergraduate/ADMI_2026_paper_3.pdf
    bib: admi2026_bib/Beckford2026aienabledconstruction.bib
    submission_type: Poster
    author_category: Student - Undergraduate
    authors: Caliese Beckford, Wesley Nicolas, Zhi Gao and Shrikant Pawar
    abstract: 'Introduction: Laser-based collagen biofabrication process is a novel
      approach for generating customizable 3D collagen structures as an in-vitro tissue
      scaffold and has the potential for in-vivo tissue engineering. The technology
      stems from the ability of a femtosecond (fs) laser pulse to optically generate
      a controlled and localized pH gradient via a two photon (2P) effect that facilitates
      the generation of collagen protein assembly, called fibrillogenesis, into fibers
      and bundles. Unlike all other collagen biofabrication techniques, this process
      utilizes the spatial and temporal precision attributed to light, which allows
      for accurate 3D modeling of native tissue structure. Tseng et. al, 2020 proposed
      a framework for a functional biopolymer that could alternate between the two
      β-sheet structures in response to pH changes. Chiba et. al, 2003 have extensively
      studied amyloidogenicity showing a significant correlation with the stability
      of the amyloid fibrils with PH, and little correlation with that of the native
      state. It has been proposed that the stability of the native state and the unfolding
      rate to the amyloidogenic precursor as well as the conformational preference
      of the denatured state is influenced by PH. The most immediate impact of collagen
      fabrication would be in the creation of custom, patterned cell culture scaffolds.
      Here, we propose an AI based innovative laser collagen alignment technique to
      be developed into an in-situ scaffold formation technology for producing next
      generation of tissue engineering-based implantable biomedical devices. Study
      Objectives: This research investigates if the use of trained convolutional neural
      net architecture (CNN) can effectively segment aligned collagen fibers deep
      inside tissue, this study set out to train a U-Net CNN architecture to accurately
      classify aligned collagen-positive pixels within a SHG image volume. This AI-enabled
      collagen image processing opens a new way to create real-time scaffold formation
      technique that mimic various in vivo tissue structures. Methods: To achieve
      this, we have used PyTorch, a python library to initialize the conventional
      U-Net CNN with four encoding and decoding units on 2000 images (Figure 1). The
      synthetic images were generated utilizing a Stable Diffusion 3.5 Large technique.
      A non-linear rectified non-linear unit (ReLU) layer comes after two 2D convolution
      layers in each encoding and decoding block. The network&#x27;s weights and biases
      are modified by an adaptive moment (ADAM) optimizer. These findings will assess
      whether a trained CNN can accurately and precisely segment aligned collagen-positive
      pixels at a variety of imaging depths assisting our understanding of fibrillogenesis
      and subsequently collagen biofabrication. Results: Primary training found the
      model to have a training loss of 0.009 with a precision and recall of &gt; 0.90.
      However, an overfitting has been observed with this run. To fix this, we intend
      to increase data (via augmentation), simplify the model by having fewer layers,
      try regularization (L1/L2), implement early stopping, or will apply K-Fold cross-validation
      to improve generalization. As an alternative, transfer learning can be used
      to modify the trained CNN for use in drastically distinct fiber networks or
      to retrain the network for images at significantly different magnifications.
      Discussion: Here, we propose an AI based innovative laser collagen alignment
      technique to be developed into an in-situ scaffold formation technology for
      producing next generation of tissue engineering-based implantable biomedical
      devices. This AI-enabled collagen image processing opens a new way to create
      real-time scaffold formation technique that mimic various in vivo tissue structure.
      These findings will assess whether a trained CNN can more accurately and precisely
      segment aligned collagen-positive pixels at a variety of imaging depths. Figure
      1: Sample image for aligned and un-aligned collagen fibrils used in CNN training.
      Acknowledgment: This study is funded by National Science Foundation South Carolina
      Established Program for Stem Cooperative Research (SC EPSCoR), GAIN CRP Subaward
      (Grants for Applications in Industry and Networking Collaborative Research Program),
      Claflin University Sub-awardee Pawar Shrikant.'
  - title: Assessing Video LLM Performance in Detecting Child Safety Risks
    submission_id: 30
    pdf: sorted_papers/Poster/Student%20-%20Undergraduate/ADMI_2026_paper_30.pdf
    bib: admi2026_bib/Keys2026assessingvideollm.bib
    submission_type: Poster
    author_category: Student - Undergraduate
    authors: Amaya Keys, Saurav Keshari Aryal and Gloria Washington
    abstract: 'Traditional baby monitoring devices serve as a cautionary tool for
      parents, guardians, and caregivers concerned about the safety and security of
      their child; however, they require constant and scrutinous supervision. With
      ever-so-persistent distractions and responsibilities, as well as the inevitable
      need for rest, humans do not have the luxury of around-the-clock surveillance.
      This preliminary study introduces the use of large language models (LLMs) to
      develop an artificial intelligence (AI)-enabled baby monitoring system that
      identifies when a child is engaging in unsafe behavior requiring adult attention.
      Forty-five use-case videos of children engaging in either dangerous or age-appropriate
      activity were fed into two video understanding LLMs: Qwen2-VL and Video-LLaVa.
      A sliding window approach was employed to simulate live video streaming. Both
      models were prompted to process the video input and return the first instance
      of danger detected. The outcomes were compared against human perception to identify
      maximal detection accuracy. Qwen’s accuracy matched human perception on 31/45
      videos by the second and 29/45 videos by the frame, yielding a 67% average accuracy
      rate. LLaVa’s accuracy matched human perception on 23/45 videos by the second
      and frame, yielding a 51% accuracy rate. Results demonstrate that the use of
      AI in child danger detection is highly feasible, and Qwen2-VL presented itself
      as the superior model for this task. Future work aims to supply the model with
      context from previous windows, perform fine-tuning, and collect data from additional
      observers to further refine accuracy and precision in preparation for deployment
      to a fully operational device.'
  - title: Understanding Object Detection Vulnerabilities in the Age of YOLO v11
    submission_id: 31
    pdf: sorted_papers/Poster/Student%20-%20Undergraduate/ADMI_2026_paper_31.pdf
    bib: admi2026_bib/Banks2026understandingobjectdetec.bib
    submission_type: Poster
    author_category: Student - Undergraduate
    authors: Trinity Banks, Idongesit Mkpong-Ruffin, Chutima Boonthum-Denecke and
      Deidre Evans
    abstract: 'Object detection models are widely used in technologies such as surveillance,
      robotics, and autonomous driving. This literature review explores how models
      like YOLOv11 have shaped the field while also remaining vulnerable to adversarial
      attacks. These attacks, including adversarial patches, can cause models to misinterpret
      images in dangerous ways. By reviewing current research, this paper highlights
      how these vulnerabilities work, why they matter, and why further study is needed
      to improve the safety and reliability of modern object detection. Object detection
      models, particularly the &quot;You Only Look Once&quot; (YOLO) series, have
      seen rapid architectural evolution from YOLOv1 to the current YOLOv11. While
      deep learning models are traditionally considered vulnerable to adversarial
      attacks, this study identifies a significant shift in the effectiveness of these
      attacks within modern training frameworks. The rapid integration of object detection
      models into these safety critical domains has made the security of these systems
      a paramount concern. While previous iterations of the “You Only Look Once” (YOLO)
      architecture have been extensively studied, the transition to the anchor-free
      model YOLOv11 presents a new landscape for adversarial robustness. This study
      performed a comprehensive analysis of established adversarial patch methodologies:
      the Dynamic Adversarial Patch (DAP), which utilized Creases Transformation (CT)
      blocks to account for movement, and the Remote Adversarial Patch (IPatch) which
      seeks to manipulate model semantics from a distance. Based on the goal of securing
      autonomous vehicle environments, this study implemented a custom replication
      of the IPatch methodology, adapting it from images segmentation to object detection.
      The experimental framework utilized the BDD100K dataset and employed Expectation
      over Transformation (EoT) to ensure the patch remained effective across various
      angles and distances. Despite an optimization process spanning 1,000 epochs
      using the Adamax optimizer, the replication failed to achieve the intended adversarial
      suppression or false-positive results. A significant outcome of this study arose
      during subsequent robustness testing, where I evaluated YOLOv11&#x27;s response
      to various digital perturbations. These experiments revealed that the model
      consistently and correctly identified the adversarial patches themselves as
      distinct objects (such as a &quot;teddy bear&quot; or &quot;person&quot;), effectively
      neutralizing the attack&#x27;s stealth. Building directly upon these findings,
      our future research will pivot to achieving adversarial stealth. Our upcoming
      work will explore the development of patches designed to be semantically hidden
      from the detection head by incorporating similarity objectives that blend the
      patch into the environmental background, testing these stealthier boundaries
      through physical experiments to improve the security of high-stakes technologies.'
  - title: 'Limitless: The future of Personalized AI power sports advertisements'
    submission_id: 32
    pdf: sorted_papers/Poster/Student%20-%20Undergraduate/ADMI_2026_paper_32.pdf
    bib: admi2026_bib/Glanton2026limitlessfuturepersonali.bib
    submission_type: Poster
    author_category: Student - Undergraduate
    authors: Luvell Glanton
    abstract: For my final class demonstration I created an advertisement using a
      key frame of a video of me and then altered the image to create a personal and
      emotional advertisement to show the potential of AI generated personalized advertisements.
      This project explores the conceptual design of an AI-powered sports advertisement
      prototype that integrates generative visual techniques and adaptive personalization
      ideas to examine how artificial intelligence may influence future sports marketing
      communication. The motivating problem is the growing need for advertisements
      that resonate with diverse audiences while maintaining creative originality
      and ethical transparency. Sports marketing provides relevant context because
      visual engagement, identity, and performance symbolism strongly influence audience
      perception and brand interaction. The project materials consist of conceptual
      advertisement imagery and illustrative video examples presented in the slides,
      rather than structured quantitative datasets. Inputs therefore include visual
      design elements, inspirational themes centered on human potential and athletic
      progression, and exploring demonstrations of AI-assisted image and video transformation.
      Methods are limited to generative and AI-enhanced visual design concepts shown
      in the presentation, including frame extraction ideas, creative recomposition,
      and hypothetical personalization workflows. The system workflow emphasizes ideation,
      visual generation, transformation, and audience-targeting concepts rather than
      algorithmic optimization or performance evaluation. Outcomes are qualitative
      and prototype-oriented, focusing on narrative coherence, visual symbolism, and
      perceived adaptability of advertisements rather than numerical metrics. Ethical
      and feasibility considerations are central to the project discussion, including
      concerns about privacy invasion, financial and energy costs of large-scale AI
      generation, and the risk of hallucinated or inaccurate outputs. These factors
      highlight the importance of transparency and responsible deployment in advertising
      analytics. Future work would involve structured data collection and research
      into audience engagement and retention when viewing a personalized ad generated
      with AI. Also, I would research how measurable evaluation of engagement outcomes
      between a variety of viewers in different demographics. I would also explore
      how personalization strategies improve engagement and retention for Ads of varying
      products. Additional development would also examine computational efficiency,
      bias mitigation, and clearer frameworks for in order to keep AI use in sports
      advertising ethical.
  - title: 'Optimizing Lineup Styles: A Data-Driven Approach to Team Performance and
      Win Probability'
    submission_id: 33
    pdf: sorted_papers/Poster/Student%20-%20Undergraduate/ADMI_2026_paper_33.pdf
    bib: admi2026_bib/Soto2026optimizinglineupstyles.bib
    submission_type: Poster
    author_category: Student - Undergraduate
    authors: Santiago Soto and Patrick Lucey
    abstract: 'Authors: Santiago Soto and Dr. Patrick Lucey Affiliation: Morehouse
      College and Stats Perform Email: santiago.soto@morehouse.edu Problem Statement:
      This ongoing research develops a predictive framework to analyze five-man lineup
      efficiency and identify player combinations that maximize Net Rating and win
      probability. By prioritizing collective unit performance over isolated individual
      metrics, the study provides actionable data for algorithmic coaching strategies
      and roster optimization. Data Description: The analysis leverages a tabular
      dataset of play-by-play basketball data featuring 9,437 unique lineups across
      30 teams. To ensure statistical significance and minimize noise, a threshold
      of 20 sequences (possessions) per lineup was applied. Key features include Offensive/Defensive
      Ratings, Rebounding Percentage, and Steal Rate. Methods and Analytical Approach
      • Feature Engineering: Performance is normalized per 100 sequences to calculate
      Net Rating (Net = Off - Def). • Weighted Aggregation: Team strength is computed
      through a weighted average of lineup metrics based on frequency of use. • Predictive
      Simulation Engine: An interactive engine was developed using scaling factors
      to ensure projections align with league-wide targets. • Correlation Analysis:
      A linear regression model assessed the relationship between net score and win
      percentage. Key Findings or Outcomes • Statistical Correlation: Regression analysis
      confirmed a near-perfect correlation (r = 0.96) between a team’s net score and
      its winning percentage. • Efficiency Tiers: The model successfully classifies
      units into Above/Below Average Efficiency based on league-wide medians. • Defensive
      Edge: &quot;Good&quot; lineups are distinguished by their ability to consistently
      limit opponent scoring, whereas weaker teams allow more points despite higher
      offensive outputs. • Win Probability: The simulation engine generates win probabilities
      and projected final scores using weighted averages. Impact, Implications, and
      Future Work: This research develops a framework for optimizing lineups against
      opponent strength using historical data, though it cannot yet incorporate real-time
      variables like injuries. Future work will expand the simulation with more granular
      features and multi-season data to assess the long-term stability of high-efficiency
      lineup styles.'
  - title: 'Perfect Path: An AI-Powered Pose Detection System for Personalized Golf
      Swing Visualization and Inclusive Sports Engagement'
    submission_id: 34
    pdf: sorted_papers/Poster/Student%20-%20Undergraduate/ADMI_2026_paper_34.pdf
    bib: admi2026_bib/Lewis2026perfectpathai.bib
    submission_type: Poster
    author_category: Student - Undergraduate
    authors: Corey Lewis and Mason Wallace
    abstract: Golf is a sport associated with technical precision and long-term participation.
      However, access, instruction costs, and social barriers can limit entry for
      many new players. Perfect Path explores how computer vision and pose estimation
      can support individualized swing analysis while lowering barriers through accessible,
      mobile-based technology. We frame the problem as both a biomechanics challenge,
      helping users understand body positioning and rotational mechanics, and a design
      challenge, creating tools that make golf instruction more approachable and data-informed.
      Our system uses user-provided videos as its primary input. Through a structured
      video-to-image workflow, users upload their footage, select a specific key frame,
      and apply pose detection to extract body lines and joint positions. Using Python
      and OpenCV, the pipeline estimates joint locations, evaluates angles and rotation,
      and exports a processed skeletal overlay for visualization and comparison. This
      transforms raw golf footage into interpretable visual feedback focused on alignment,
      posture, and swing path. The prototype demonstrates a complete end-to-end workflow.
      First is video upload, second comes frame selection, third is automated pose
      detection, and lastly, an exportable visualization is provided to the user.
      Importantly, the system does not employ predictive modeling to forecast performance
      outcomes such as hot distance or scoring improvement. Instead, it prioritizes
      transparent, interpretable visual analytics that allow users to directly observe
      their mechanics. By avoiding predictions, the tool emphasizes general skill
      development through self-assessment rather than guiding users to improve on
      a specific course without raising their overall skill level. From an inclusion
      perspective, the system is designed to reduce intimidation often experienced
      by beginners in traditional golf settings. Instruction can be costly, socially
      hierarchical, and reliant on in-person correction. By enabling private, self-paced
      analysis on a personal device, users can identify and correct mechanical errors
      without the pressure of public critique. This approach may help create a more
      welcoming entry point for individuals who feel underrepresented in golf spaces.
      Future development for this project includes a real-time mobile application
      capable of live swing capture, immediate pose-based feedback, and side-by-side
      comparison with a built-in reference skeleton. These enhancements would extend
      usability while maintaining a clear, interpretable analytics framework.
  - title: Fine-Tuning DistilBERT, DeBERTa and ModernBERT for Valence–Arousal Prediction
      and Change Estimation
    submission_id: 36
    pdf: sorted_papers/Poster/Student%20-%20Undergraduate/ADMI_2026_paper_36.pdf
    bib: admi2026_bib/Shah2026finetuningdistilbert.bib
    submission_type: Poster
    author_category: Student - Undergraduate
    authors: Araj Shah, Saurav Keshari Aryal, Utsav Shah and Gloria Washington
    abstract: 'We propose a unified, lightweight, and reproducible set of models for
      longitudinal valence–arousal (VA) modeling in a corpus of essays written over
      time by U.S. service-industry workers. Using only the official SemEval 2026
      Task 2 data, we enforce user-disjoint splits to prevent leakage and ensure comparable
      evaluation. We decompose VA modeling into three complementary prediction views:
      (i) per-essay VA state estimation from text, (ii) short-horizon user-level VA
      change forecasting from recent history, and (iii) longer-horizon disposition-change
      prediction from aggregated user histories. For essay-level state estimation,
      we fine-tune a DistilBERT encoder with a lightweight regression head. For short-horizon
      forecasting, we pair ModernBERT-based text representations with trajectory-derived
      numeric features and blend a simple previous-delta baseline with a GRU sequence
      regressor over recent embeddings. For longer-horizon disposition modeling, we
      pool DeBERTa-based user-history embeddings, augment them with normalized summary
      features, and apply a compact MLP regressor. On the official evaluation, we
      obtain Subtask 1 (essay-level state) composite Pearson r = 0.665 (valence),
      0.468 (arousal) (official baseline: 0.557, 0.299); Subtask 2A (short-horizon
      change) Pearson r = 0.597 (valence), 0.413 (arousal) (official baseline: 0.615,
      0.670); and Subtask 2B (disposition change) Pearson r = 0.046 (valence), 0.348
      (arousal) (official baseline: 0.434, 0.584). Across all settings, we prioritize
      strict split control and transparent inference pipelines to make results easy
      to reproduce and extend, providing a reliable foundation for future work on
      longitudinal emotion dynamics.'
  - title: Time-Aware Two-Dimensional Packing for Throughput Optimization in Slicing-Aware
      3D Printing
    submission_id: 38
    pdf: sorted_papers/Poster/Student%20-%20Undergraduate/ADMI_2026_paper_38.pdf
    bib: admi2026_bib/Christian2026timeawaretwo.bib
    submission_type: Poster
    author_category: Student - Undergraduate
    authors: Stephone Christian, Blayne Montaque and Saurav Aryal
    abstract: Batching multiple parts onto a single fused-filament fabrication build
      plate improves throughput, but existing packing algorithms optimize for geometric
      density rather than print time. We introduce a slicing-aware cost model that
      estimates print time from part geometry and placement without invoking toolpath
      generation, achieving strong correlation with slicer-reported times (Pearson
      r = 0.90, Spearman ρ = 0.96). Evaluating packing algorithms on synthetic production
      builds, we find that greedy polygon-based packing matches or exceeds Large Neighborhood
      Search at three orders of magnitude lower compute cost — a negative result we
      attribute to high initial packing density leaving minimal room for iterative
      refinement. Against PrusaSlicer’s default auto-arrange, our method achieves
      5.7% throughput improvement (95% CI [4.7%, 7.3%], N = 329), with median savings
      of 19.5 minutes per build.
  - title: Disaster Relief AI Chatbot
    submission_id: 39
    pdf: sorted_papers/Poster/Student%20-%20Undergraduate/ADMI_2026_paper_39.pdf
    bib: admi2026_bib/Chimezie2026disasterreliefai.bib
    submission_type: Poster
    author_category: Student - Undergraduate
    authors: Ezichi Chimezie, Blayne Montaque, Terri Adams-Fuller, Saurav Aryal and
      Legand Burge
    abstract: During natural disasters, access to timely and reliable information
      is critical. However, many emergency communication systems depend on continuous
      internet connectivity or one-way broadcast alerts that can become inaccessible
      during infrastructure disruptions. This work addresses the need for accessible,
      conversational access to structured disaster information across multiple delivery
      channels. We developed a dual-mode conversational chatbot that integrates large
      language model–driven dialogue with authoritative, structured data services.
      A GPT-based model interprets natural language queries and routes them to six
      disaster-relevant services via external APIs, including weather conditions,
      air quality, emergency alerts, road conditions, shelter availability, and geolocation.
      A local persistence layer supports session management and system coordination.
      The system provides both web-based and SMS-based interfaces, enabling access
      across different connectivity contexts. The current prototype grounds all responses
      in verified service outputs, incorporates location-awareness and emergency-detection
      workflows, and supports multi-intent query handling. Ongoing work focuses on
      improving system robustness, expanding fault tolerance, and preparing the platform
      for scalable deployment.
  - title: Exploring Prompt Strategies for Joke Generation Under Input Constraints
    submission_id: 40
    pdf: sorted_papers/Poster/Student%20-%20Undergraduate/ADMI_2026_paper_40.pdf
    bib: admi2026_bib/Lawal2026exploringpromptstrategie.bib
    submission_type: Poster
    author_category: Student - Undergraduate
    authors: Abdulmujeeb Lawal and Saurav Keshari Aryal
    abstract: A number of studies have explored what makes jokes funny. Conversely,
      only a few have actually tackled generating them, mostly leaving humor-generation
      relatively unexplored. The SemEval MWAHAHA Challenge tasks participants with
      generating jokes under different constraints with the aim of pushing models
      beyond memorization towards genuine joke creation. In Subtask A, inputs were
      either keyword pairs or news headlines, and jokes had to incorporate both keywords
      or draw from the given headline. For headlines, we prompted the model to write
      reaction-style tweets, which produced more natural humor, while for the keyword
      pairs, we had the model adopt Dave Chappelle&#x27;s comedic persona to create
      observational jokes about some everyday situations and disappointments. We experimented
      primarily with open-source models (Llama and Qwen) and ended up using Llama
      for our final submission. In our preliminary results, we found that persona-based
      prompting consistently outperformed generic prompting approaches. The Chappelle-style
      observational jokes for keyword pairs also seemed to elicit more reactions than
      the standard outputs, and the tweet-format jokes for headlines felt more natural
      and appropriate for the given context. We also observed that models struggled
      a lot more with keyword pairs than with headlines, most likely because combining
      two unrelated words into coherent humor may require a bit more creative reasoning.
      Our findings show that tailoring prompting methods based on input type, rather
      than applying a singular approach, decently improves humor generation. Our work
      also shows the value of using personas when guiding models toward more diverse
      and naturally funny jokes.
  - title: Speech-Based Detection and Severity Assessment of Alzheimer’s Disease
    submission_id: 41
    pdf: sorted_papers/Poster/Student%20-%20Undergraduate/ADMI_2026_paper_41.pdf
    bib: admi2026_bib/Ezikeoha2026speechbaseddetection.bib
    submission_type: Poster
    author_category: Student - Undergraduate
    authors: Chidubem Valentine Ezikeoha, Saurav Keshari Aryal and Howard Prioleau
    abstract: Early detection in Alzheimer’s remains challenging, as current diagnostic
      methods rely on clinical expertise, and cognitive testing, which can be costly
      and inaccessible. Because cognitive decline is reflected in speech through changes
      in vocabulary, readability, pauses, articulation, and prosody, spoken language
      offers a scalable, low-cost, and non-invasive signal for screening and monitoring.
      Prior work demonstrated good performance in predicting Mini-Mental State Examination
      (MMSE) scores using large acoustic-linguistic feature sets, with optimized LightGBM
      and ensemble models significantly reducing RMSE and achieving strong Alzheimer’s
      detection accuracy. In this work, we extend beyond text-focused modeling toward
      a multilingual, audio-driven model for dementia detection and severity assessment.
      We train Audio Spectrogram Transformer (AST) models across ADReSS-style datasets
      to establish robust audio-only baselines, apply multilingual automatic speech
      recognition to obtain transcripts, and develop multimodal fusion models that
      integrate acoustic embeddings with linguistic features. This work lays the foundation
      for scalable and multilingual speech-based tools that can support early dementia
      detection. By using both audio and linguistic signals, it moves towards a more
      accessible approach to identifying cognitive decline.
  - title: A.N.T.S. (Autonomous, Navigation, Technician, Swarm)
    submission_id: 42
    pdf: sorted_papers/Poster/Student%20-%20Undergraduate/ADMI_2026_paper_42.pdf
    bib: admi2026_bib/Gourdine2026nts.bib
    submission_type: Poster
    author_category: Student - Undergraduate
    authors: Luther Gourdine, Alejandro Fountain, Blayne Montaque, Brandon Williams,
      Bipul Gyawali, Somkenechukwu Onwusika, Kroix Jones, Kwaku Asare and Saurav Aryal
    abstract: This project addresses aircraft exterior inspections performed between
      flights to identify cracks, dents, corrosion, and paint erosion. Today, these
      walk-through inspections require significant manpower, can vary by inspector,
      and may expose technicians to safety risks when accessing elevated or hard-to-reach
      areas. A.N.T.S. (Autonomous, Navigation, Technician, Swarm) proposes an operator-supervised
      autonomous drone inspection system to improve repeatability, documentation quality,
      and inspection efficiency while maintaining technicians&#x27; full decision-making
      authority. Our approach uses stable, close-range quadcopter flights around a
      stationary aircraft to capture high-resolution imagery (with optional depth
      sensing). Collected data is processed on resource-constrained edge hardware
      using an embedded computer-vision pipeline (YOLOv8n) to detect defect candidates
      and automatically generate maintenance-ready inspection reports. To ensure flight
      safety and real-world reliability, the system includes software-controlled inference
      throttling to manage power and thermal limits during inspection. So far, we
      have defined the inspection concept of operations as a decision-support workflow,
      selected the baseline perception model (YOLOv8n) and edge-inference strategy,
      and outlined validation needs for close-proximity navigation near reflective
      surfaces, varied lighting, and different materials. Next steps focus on assembling
      test imagery, integrating sensors, and running controlled flight and mock-panel
      defect trials.
  - title: Evidence Guided Abductive Scoring with Option Conditioned Retrieval and
      Constrained LLM Evaluation
    submission_id: 43
    pdf: sorted_papers/Poster/Student%20-%20Undergraduate/ADMI_2026_paper_43.pdf
    bib: admi2026_bib/Ayandosu2026evidenceguidedabductive.bib
    submission_type: Poster
    author_category: Student - Undergraduate
    authors: Ifeoluwakiitan Ayandosu and Saurav Keshari Aryal
    abstract: Abductive event reasoning in the wild requires selecting plausible explanations
      for an event from noisy, partially relevant multi document context. We present
      an evidence guided abductive scoring pipeline for SemEval 2026 Task 12 that
      separates evidence selection from explanation scoring. For each topic, we chunk
      documents and retrieve option conditioned evidence using dense embeddings, then
      apply a cross encoder reranker to form compact evidence packs per option. A
      constrained large language model scorer evaluates each option using only its
      evidence pack and outputs structured signals capturing evidence support, explanatory
      directness, and contradiction. We then apply deterministic decision rules to
      produce single or multi label predictions, including robust handling of none
      of the above style options through semantic detection rather than reliance on
      option position. This modular design reduces distraction from irrelevant documents,
      improves comparability across options, and enables controlled calibration for
      multi answer outputs. Our approach demonstrates that retrieval focused evidence
      compression combined with disciplined, signal based scoring can effectively
      support abductive reasoning without explicit knowledge graphs or end to end
      prompting over full document context.
  - title: 'Unsupervised People’s Speech Challenge: BiMamba2 Masked Spectrogram Model'
    submission_id: 44
    pdf: sorted_papers/Poster/Student%20-%20Undergraduate/ADMI_2026_paper_44.pdf
    bib: admi2026_bib/Subedi2026unsupervisedpeoplesspeec.bib
    submission_type: Poster
    author_category: Student - Undergraduate
    authors: Prakriti Subedi, Saurav Keshari Aryal and Howard Prioleau
    abstract: Self-supervised speech learning extracts transferable representations
      from unlabeled audio, which is essential for multilingual settings where transcripts
      and reliable language annotations are limited. We present a masked spectrogram
      modeling (MSM) system for the Unsupervised Speech in the Wild Challenge (UPS
      dataset), Open Filtering sub-track, with an emphasis on data selection strategies
      that reduce language imbalance during training. The UPS audio pool is large
      and highly multilingual, but the distribution is skewed toward high-resource
      languages. To prevent training from being dominated by a small number of languages,
      we enforce manifest-level balancing for the non-English portion by grouping
      examples by language and applying a per-language quota (cap) before filling
      a fixed multilingual budget. In our current setup, no single non-English language
      contributes more than 4,000 examples to the multilingual manifest, ensuring
      consistent representation of lower-resource languages throughout training. We
      train a BiMamba2-based MSM model on log-mel spectrogram segments (10-second
      chunks), reconstructing masked time-frequency regions to learn phonetic and
      speaker structure without supervision. The current training phase uses 200 hours
      of filtered audio (100 hours English, 100 hours non-English) aligned with the
      challenge’s Few-Shot ASR, Zero-Shot Language ID, and Speaker Clustering objectives.
      Preliminary results show stable optimization, with validation loss decreasing
      from approximately 12.0 at early checkpoints (1k–2k steps) to 4.68 at 145k steps,
      indicating substantially improved reconstruction under multilingual balancing.
      We plan to scale to larger filtered subsets and evaluate downstream transfer
      on the challenge metrics.
  - title: 'Evaluating Dialect Bias in Commercial Automatic Speech Recognition Systems:
      A Comparative Analysis of AAVE, Clean, and Noisy Speech'
    submission_id: 46
    pdf: sorted_papers/Poster/Student%20-%20Undergraduate/ADMI_2026_paper_46.pdf
    bib: admi2026_bib/Gregg2026evaluatingdialectbias.bib
    submission_type: Poster
    author_category: Student - Undergraduate
    authors: Kennedy Gregg, Gloria Washington and Saurav Keshari Aryal
    abstract: 'A Statistical Fairness Evaluation Using Error and Semantic Similarity
      Metrics Kennedy Gregg HCAI Institute, Howard University, kennedy.gregg@bison.howard.edu
      Saurav Keshari Aryal HCAI Institute, Howard University, saurav.aryal@howard.edu
      Gloria Washington HCAI Institute, Howard University, gloria.washington@Howard.edu
      This study evaluates eight commercial automatic speech recognition (ASR) systems
      Google Cloud Speech, Microsoft Azure AI Speech, IBM Watson Speech, Deepgram,
      Amazon Transcribe, OpenAI Speech, AssemblyAI, and Speechmatics across three
      speech conditions: clean Common Voice (CV), African American Vernacular English
      (AAVE), and noisy CV. Outputs were compared to human transcripts using word
      error rate (WER), character error rate (CER), Levenshtein distance, and semantic
      similarity metrics (BERT cosine similarity, Euclidean distance, Jaccard similarity).
      Two-sample t-tests (Student’s or Welch’s, selected via Levene’s test) with Benjamini
      Hochberg correction assessed performance differences. All vendors showed statistically
      significant disparities across all metrics (adjusted p ≈ 0 to &lt; 10⁻⁵⁸). AAVE
      speech produced higher error rates and lower semantic similarity than noisy
      CV, indicating reduced transcription accuracy linked to dialectal variation
      rather than noise. These findings highlight the need for dialect-aware benchmarking
      to ensure equitable ASR performance. REFERENCES [1] Manu Edavakandam, “From
      Audio to Words: A Python Guide to Measuring Transcription Accuracy,”Medium,2023.
      https://medium.com/@manuedavakandam/from-audio-to-words-a-python-guide-to-measuring-transcription-accurracy-f9dd9e70651f'
  - title: Improving Multilingual Medieval Handwriting Recognition through Multimodal
      Language Modeling
    submission_id: 48
    pdf: sorted_papers/Poster/Student%20-%20Undergraduate/ADMI_2026_paper_48.pdf
    bib: admi2026_bib/Igwe2026improvingmultilingualmed.bib
    submission_type: Poster
    author_category: Student - Undergraduate
    authors: Nmachi Igwe, Saurav Keshari Aryal and Nmachi Igwe
    abstract: The automatic recognition of multilingual medieval manuscripts remains
      a challenging task due to the wide variety of languages and writing styles,
      making it difficult to achieve consistent analysis. Historical documents exhibit
      grammatical irregularities such as inconsistent spelling and nonstandard grammar,
      degraded manuscript conditions that have compromised legibility over time, multiple
      languages written in diverse alphabets, and paleographic complexities, thus
      rendering conventional OCR(Optical Character Recognition) systems ineffective.
      Using the CMMHWR26 dataset as a source of multilingual medieval manuscript data,
      we acquire and preprocess manuscript images and their corresponding transcriptions
      to ensure proper normalization and formatting. Our method focuses on training
      open-weight multimodal language models that integrate visual and textual data
      to improve handwritten text recognition performance. By leveraging both image-based
      features and language modeling capabilities, the system aims to achieve robustness
      and generalization across diverse medieval scripts and languages, including
      related and linguistically different language families. This work contributes
      to the development of multilingual historical handwritten text recognition by
      exploring the use of open-weight multimodal language models in medieval manuscript
      settings, supporting the creation of more robust systems capable of handling
      real-world retrodigitization challenges and improving large-scale digitization
      efforts in the digital humanities.
  - title: Black Press + AI
    submission_id: 49
    pdf: sorted_papers/Poster/Student%20-%20Undergraduate/ADMI_2026_paper_49.pdf
    bib: admi2026_bib/Davies2026blackpressai.bib
    submission_type: Poster
    author_category: Student - Undergraduate
    authors: Kingston Davies, Saurav Keshari Aryal and Gloria Washington
    abstract: Historical newspaper archives are critical for preserving Black press
      history, yet many digitized newspapers exist as fragmented image strips that
      are difficult to access and study. This fragmentation hinders researchers&#x27;
      ability to efficiently navigate and analyze these invaluable historical documents.
      Working with the Black Press Archive at Howard University, this project addresses
      this challenge by developing an automated pipeline to reconstruct complete newspaper
      pages from image strips. Using OpenCV computer vision library, the approach
      vertically concatenates sequential newspaper strips into complete documents.
      The system then employs brightness analysis to detect dark horizontal gaps between
      pages, automatically identifying page boundaries and splitting the stitched
      image into individual pages. This eliminates manual segmentation work that would
      otherwise be time-intensive and error-prone. The implemented pipeline successfully
      processes multiple newspaper strips, generates intermediate stitched outputs
      for quality verification, and produces organized individual page files. This
      automation significantly improves the accessibility and usability of the Black
      Press Archive&#x27;s digitized newspaper collection for historical research
      and preservation.
  - title: Augmenting Naval Ship Images for Viewing Distance using Adobe Generative
      Fill
    submission_id: 52
    pdf: sorted_papers/Poster/Student%20-%20Undergraduate/ADMI_2026_paper_52.pdf
    bib: admi2026_bib/Nesbeth2026augmentingnavalship.bib
    submission_type: Poster
    author_category: Student - Undergraduate
    authors: Clemson Nesbeth, Saurav Keshari Aryal, Gloria Washington, Jaye Nias,
      Christopher Watson and Janelle Yankey
    abstract: The aim of this project is to assess the ability of a generative AI
      to produce reasonable and believable images based on the same original images
      at varying scales to simulate differences in distance from the object. The objects
      used in this project were varying types of ships. The generated images were
      assessed in three different ways, all on a scale of high medium and low to measure
      levels of quality. Firstly, background quality which refers to the realism and
      consistency of the generated image. Subject dimensions which refers to how well
      the generated image preserves the scale and zoom of the ship in the original
      image. And subject integrity, which referred to the features of the ship and
      how consistent and believable they were. Additionally, we noted whether the
      original image contained the ship as a whole without any ‘cut off’ parts, and
      if so, being labelled as “Incomplete source”. And lastly was “Artifact present”
      which stated if the generated image had had hallucinations or objects added
      that were not present in the original image. Space was also made for comments
      to be made on the generated images.
  - title: Advanced Methods for Top-View RGB-D Person Re-ID (TVRID)
    submission_id: 53
    pdf: sorted_papers/Poster/Student%20-%20Undergraduate/ADMI_2026_paper_53.pdf
    bib: admi2026_bib/Gyawali2026advancedmethodstop.bib
    submission_type: Poster
    author_category: Student - Undergraduate
    authors: Bipul Gyawali and Saurav Aryal
    abstract: 'This paper presents a robust framework for Top-View RGB-D Person Re-Identification
      (TVRID), addressing the specific challenges of the ICPR 2026 competition. Our
      approach integrates three specialized tracks: an RGB track utilizing part-based
      attention and ResNet backbones (e.g., ViT, Swin) to improve robustness to occlusion;
      a Depth track focusing on body-shape cues learned from 1-channel depth with
      attention and metric losses; and a Cross-Modal track employing dual-stream fusion
      with optional cross-attention and cross-modal metric losses. By combining identity
      (ArcFace) and metric (batch-hard triplet, center) losses within a PyTorch Lightning
      framework, our method achieves strong discriminability across same-camera and
      cross-passage scenarios.'
  - title: Knowledge-Grounded Adverse Drug Event Detection from Clinical Narratives
    submission_id: 54
    pdf: sorted_papers/Poster/Student%20-%20Undergraduate/ADMI_2026_paper_54.pdf
    bib: admi2026_bib/FidelIbeabuchi2026knowledgegroundedadverse.bib
    submission_type: Poster
    author_category: Student - Undergraduate
    authors: Soluchi Fidel-Ibeabuchi, Saurav Aryal and Howard Prioleau
    abstract: Adverse Drug Events (ADEs) remain a leading cause of preventable morbidity
      and healthcare expenditure, yet their identification from electronic health
      records (EHRs) remains challenging due to the unstructured and context-dependent
      nature of clinical narratives. While annotated corpora such as the n2c2 dataset
      support benchmark evaluation, their limited scale and annotation cost constrain
      generalizability. We present a knowledge-grounded ADE detection framework that
      integrates clinical note extraction with structured pharmacovigilance knowledge
      from SIDER. Our approach first applies large language model (LLM)-based entity
      and relation extraction to identify drug–event mentions within clinical text.
      We then incorporate a context-engineering layer that cross-references extracted
      drug entities against curated side-effect profiles in SIDER, enabling structured
      validation of candidate ADE associations. This integration reduces spurious
      drug–event pairings while preserving sensitivity to plausible associations,
      thereby improving precision without sacrificing recall. By combining biomedical
      knowledge bases with LLM-driven extraction, this work demonstrates a scalable
      and biologically informed strategy for pharmacovigilance from real-world clinical
      data. The proposed framework contributes to translational health informatics
      by bridging curated molecular–drug knowledge and patient-level clinical evidence.
  - title: Onboard Multimodal Learning for Data-Driven Decision-Making in Humanoid
      Robotics
    submission_id: 60
    pdf: sorted_papers/Poster/Student%20-%20Undergraduate/ADMI_2026_paper_60.pdf
    bib: admi2026_bib/Rollins2026onboardmultimodallearnin.bib
    submission_type: Poster
    author_category: Student - Undergraduate
    authors: Olivia Rollins, Blayne Montaque and Saurav Keshari Aryal
    abstract: This work presents the development of a modular bipedal humanoid platform
      focused on tightly integrating onboard artificial intelligence with multimodal
      sensor perception for data-driven autonomy. Built upon the Berkeley Humanoid
      Lite architecture, the system emphasizes the unification of mechanical design,
      embedded compute, and learning-based control within a fully self-contained humanoid
      framework. We design and implement a multimodal sensor array incorporating LiDAR,
      RGB and depth cameras, and microphone inputs, enabling rich environmental perception
      across spatial and acoustic domains. Sensor data are synchronized and fused
      through a ROS 2-based middleware pipeline to produce real-time state estimation,
      semantic scene understanding, and context-aware environmental representations.
      These perception outputs inform higher-level decision-making modules, allowing
      the robot to adapt its locomotion and manipulation strategies based on sensed
      environmental conditions rather than pre-scripted behaviors. Locomotion and
      task policies are trained in GPU-accelerated simulation and deployed to onboard
      embedded AI hardware for low-latency inference. This architecture enables closed-loop,
      perception-driven autonomy without reliance on external compute infrastructure.
      We evaluate system performance in terms of perception latency, decision consistency,
      and behavioral adaptability in dynamic indoor environments. The resulting platform
      demonstrates a scalable approach to embedding AI directly within humanoid robotic
      systems, enabling real-time, sensor-informed decision-making and advancing the
      integration of learning-based intelligence in embodied agents.
  - title: 'Beyond Accuracy: Forensic Evaluation of Trust and Grounding in LLM Outputs'
    submission_id: 62
    pdf: sorted_papers/Poster/Student%20-%20Undergraduate/ADMI_2026_paper_62.pdf
    bib: admi2026_bib/Watson2026beyondaccuracyforensic.bib
    submission_type: Poster
    author_category: Student - Undergraduate
    authors: Christopher Watson, Janelle Yankey, Jaye Nias, Saurav Aryal, Jeremy Blackstone,
      Simone Smarr, Lucretia Williams and Gloria Washington
    abstract: 'Large language models (LLMs) are increasingly used in high-stakes decision
      support to summarize situations, propose actions, and communicate rationale.
      While these systems often produce fluent and plausible responses, such outputs
      can obscure uncertainty, weaken grounding, and invite over-reliance by human
      decision-makers. We present Project Comprehension, a forensic evaluation framework
      that examines LLM outputs as decision-relevant artifacts rather than isolated
      answers. The framework combines operationally grounded scenarios with human-centered
      annotation to assess plausibility, uncertainty signaling, grounding transparency,
      comprehension support, and actionability. Across empirical testing, we find
      that surface-level response quality is only weakly predictive of grounding transparency:
      a non-trivial subset of responses appear clear and actionable while providing
      limited justification or source signaling. These patterns highlight an interpretive
      risk that is not captured by accuracy-focused evaluation alone. We discuss how
      forensic evaluation can support trust calibration, assurance practices, and
      the design of language-enabled decision support systems that better align with
      human judgment in high-stakes contexts.'
  - title: Fine-Tuning SimAM-ResNet34 and WavLM-Base for Cross-Lingual Speaker Verification
    submission_id: 64
    pdf: sorted_papers/Poster/Student%20-%20Undergraduate/ADMI_2026_paper_64.pdf
    bib: admi2026_bib/Shah2026finetuningsimam.bib
    submission_type: Poster
    author_category: Student - Undergraduate
    authors: Araj Shah, Saurav Keshari Aryal, Howard Prioleau and Gloria Washington
    abstract: We present a lightweight, reproducible submission for the TidyVoice
      2026 cross-lingual speaker verification challenge implemented in the WeSpeaker
      toolkit under single-GPU Google Colab constraints. Our primary system, S1, uses
      the official SimAM-ResNet34 checkpoint pretrained on VoxBlink2 and VoxCeleb2
      and fine-tuned on TidyVoiceX, which we further fine-tune for five epochs with
      large-margin classification. In parallel, we implement a secondary self-supervised
      system, S2, using a frozen WavLM-Base frontend with a compact statistics pooling
      speaker head, trained for four epochs. Both systems use standard speech augmentation
      during training with MUSAN noise and RIRS reverberation, while inference uses
      clean embeddings and cosine scoring. To combine systems, we perform score-level
      fusion calibrated on a labeled Tune-S development split. We z-normalize each
      system’s Tune-S scores using their mean and standard deviation, grid-search
      a convex fusion weight alpha in the range 0 to 1 with step 0.01 to minimize
      EER, and apply the frozen normalization and alpha to fuse Eval-A (Task 1) and
      Eval-U (Task 2) score files for submission. On Tune-S, S1 substantially outperforms
      S2, so the selected fusion weight is alpha equals 1.0.
  - title: 'Ensemble Voting and Meta-Learning for Homonym Disambiguation: A Hybrid
      Approach to SemEval 2026 Task 5'
    submission_id: 65
    pdf: sorted_papers/Poster/Student%20-%20Undergraduate/ADMI_2026_paper_65.pdf
    bib: admi2026_bib/Asare2026ensemblevotingmeta.bib
    submission_type: Poster
    author_category: Student - Undergraduate
    authors: Kwaku Asare and Saurav Aryal
    abstract: 'We present a hybrid ensemble approach for SemEval 2026 Task 5 (AmbiStory),
      which requires predicting the plausibility of homonym senses in literary narratives
      on a 1–5 ordinal scale. The task challenges systems to handle nuanced contextual
      ambiguity in creative writing, where traditional Word Sense Disambiguation methods
      often fail. Our methodology combines the complementary strengths of large language
      models and fine-tuned transformers through a multi-stage pipeline. First, we
      employ diverse LLM prompting strategies including few-shot learning, contrastive
      reasoning, and chain-of-thought prompts across multiple model providers and
      temperature settings, with optional retrieval-augmented generation to surface
      relevant training examples. Second, we fine-tune RoBERTa-large for ordinal regression
      using contextualized example sentences, deploying a multi-seed ensemble to reduce
      prediction variance. Third, we apply ensemble voting with median score aggregation
      across LLM outputs to improve prediction robustness. Finally, we integrate LLM
      ensemble and RoBERTa predictions through hybrid combination methods: weighted
      averaging, confidence-based weighting, and a calibrated meta-learner that learns
      optimal blending strategies from development data. Our approach achieves 80%
      exact-label accuracy and 0.74 Spearman correlation on the development set, substantially
      outperforming baseline methods. The results demonstrate that structured reasoning
      from LLMs, when combined with learned transformer representations, ensemble
      aggregation, and proper calibration, effectively captures the ordinal nature
      of sense plausibility in complex literary contexts. Ablation studies reveal
      that ensemble voting reduces individual model variance while the meta-learner
      successfully exploits complementary error patterns between LLM and RoBERTa components.
      Future work will explore refined retrieval mechanisms and ensemble optimization
      strategies.'
  - title: Clustering + Adversarial AI
    submission_id: 67
    pdf: sorted_papers/Poster/Student%20-%20Undergraduate/ADMI_2026_paper_67.pdf
    bib: admi2026_bib/SarkiUmar2026clusteringadversarialai.bib
    submission_type: Poster
    author_category: Student - Undergraduate
    authors: Kafilat Sarki-Umar and Saurav Keshari Aryal
    abstract: This paper investigates whether personality type influences a user&#x27;s
      ability to bypass AI safety guardrails. We construct psychologically grounded
      personas using Gaussian Mixture Models (GMM) applied to the Big Five personality
      dimensions (Openness, Conscientiousness, Extraversion, Agreeableness, Neuroticism),
      drawing from the Statistical &quot;Which Character&quot; Personality Quiz (SWCPQ)
      dataset of 2,125 fictional characters rated on 500 personality traits. Characters
      are clustered per Big Five dimension independently to avoid high-dimensionality
      issues, with optimal K determined via the elbow method, silhouette scoring,
      AIC, and BIC, and validated through bootstrap resampling. Each cluster&#x27;s
      most representative character becomes the blueprint for a persona, yielding
      P unique AI personas encoded as LLM system prompts. These personas systematically
      probe AI models with restricted prompts, measuring compliance rates and manipulation
      strategies across personality types. Preliminary clustering with K=7 produced
      balanced groupings with exemplars from works including 10 Things I Hate About
      You and The Great Gatsby, though AIC and BIC disagreement motivated the shift
      to Big Five-aligned clustering. Next steps include completing the Big Five trait
      mapping, constructing the full persona matrix, and running probing experiments
      to determine which personality profiles most effectively bypass AI safety guardrails.
  - title: 'THE LANGUAGE FAMILY EFFECT: IMPROVING AFRICAN SENTIMENT MODELS THROUGH
      LINGUISTIC RELATEDNESS'
    submission_id: 68
    pdf: sorted_papers/Poster/Student%20-%20Undergraduate/ADMI_2026_paper_68.pdf
    bib: admi2026_bib/Kalitsi2026languagefamilyeffect.bib
    submission_type: Poster
    author_category: Student - Undergraduate
    authors: Selorm Kalitsi, Saurav Aryal and Howard Prioleau
    abstract: 'African languages represent one of the world’s most linguistically
      diverse regions, yet they remain critically under-resourced in Natural Language
      Processing, limiting the development of equitable and effective language technologies.
      Sentiment analysis for these languages is particularly constrained by scarce
      labeled data, limited representation in pretrained models, and heavy reliance
      on translation-based pipelines that introduce cultural and semantic distortion,
      especially in code-switched contexts. This work extends the AfriSenti benchmark
      with sentiment data from 38 additional African languages and examines how linguistic
      relatedness, captured through language family structure, can be leveraged to
      improve multilingual sentiment modeling. We evaluate two complementary approaches:
      extended task- adaptive pretraining on a large and heterogeneous multilingual
      dataset, and direct language and family conditioning through explicit input-level
      metadata. Experiments conducted at the overall, language family, and individual
      language levels show that task-adaptive pretraining provides strong gains in
      large and noisy multilingual settings, while direct language and family conditioning
      is most effective on smaller and cleaner benchmarks such as AfriSenti. Together,
      these results provide empirical evidence for the language family effect, demonstrating
      that both implicit and explicit modeling of genealogical relationships improves
      robustness and generalization for African languages that are underrepresented
      or absent in standard pretrained models. Our findings highlight the value of
      linguistically grounded and data- efficient approaches for building more inclusive
      and sustainable NLP systems for African languages.'
  - title: 'Beyond Visible Spectrum: Developing Computer Vision Techniques for Agricultural
      Hyperspectral Image Categorization'
    submission_id: 69
    pdf: sorted_papers/Poster/Student%20-%20Undergraduate/ADMI_2026_paper_69.pdf
    bib: admi2026_bib/Perkins2026beyondvisiblespectrum.bib
    submission_type: Poster
    author_category: Student - Undergraduate
    authors: Todd Perkins and Saurav Aryal
    abstract: Technology revolving around remote sensing is being utilized to effectively
      identify crop diseases in agricultural areas. Crop diseases such as fungal,
      bacterial, and other infections impact agricultural productivity, which can
      reduce plant growth and nutritional value in everyday food. Throughout past
      research, advances in digital imaging have led researchers to developing methods
      for seeking potential in crop disease diagnosis through RGB imagery, hyperspectral
      data, and multispectral analysis. However, the vast number of spectral bands
      and relationships in remote sensory can pose a challenge to effectively select
      features and extract data. That is where we come in as we are currently in the
      process of creating deep learning algorithms to negate those situations. The
      approach I have come to take is through developing a complex file discovery
      and reading pipeline to accurately read agricultural data based on the image
      and file type. My script for containing specific files such as TIF, PNG, and
      CSV finds the file, analyzes the image, and then extracts the data to give statistics
      and previews. I have made this happen through utilizing OpenCV, pandas, rasterio,
      and pathlib to accomplish this.
  - title: Query Reformulation and Dense-Lexical Retrieval Fusion for Multi-Turn Retrieval-Augmented
      Generation
    submission_id: 70
    pdf: sorted_papers/Poster/Student%20-%20Undergraduate/ADMI_2026_paper_70.pdf
    bib: admi2026_bib/Shrestha2026queryreformulationdense.bib
    submission_type: Poster
    author_category: Student - Undergraduate
    authors: Sijan Shrestha and Saurav Aryal
    abstract: 'While large language models increasingly serve as chat-based assistants,
      grounding their responses in retrieved evidence across multi-turn conversations
      remains a significant challenge, particularly when questions reference earlier
      turns, when the system must recognize unanswerable queries rather than hallucinate,
      and when relevant passages shift as the conversation evolves. We address these
      challenges on the MTRAG benchmark across four domain-specific corpora: ClapNQ
      (Wikipedia), Cloud (technical documentation), FiQA (financial), and Govt (government
      web pages). Our system employs a hybrid retrieve-then-rerank architecture. Queries
      are first augmented through LLM-driven query rewriting, breaking down entities
      and query itself, and generating hypothetical embeddings (HyDE) for semantic
      matching. Results from dense vector search and lexical matching are then fused
      via Reciprocal Rank Fusion and reranked though cross-encoder. Llama-3.3-70B-Instruct
      then generates responses based strictly on the most relevant text passages.
      The system achieves an nDCG@5 of 0.4098 on passage retrieval, a harmonic mean
      of 0.7462 on reference-grounded generation, and 0.5796 on end-to-end RAG.'
  - title: Artificial Intelligence and the Expanding Digital Divide
    submission_id: 71
    pdf: sorted_papers/Poster/Student%20-%20Undergraduate/ADMI_2026_paper_71.pdf
    bib: admi2026_bib/Rapheal2026artificialintelligenceex.bib
    submission_type: Poster
    author_category: Student - Undergraduate
    authors: Nadia Rapheal and E. Rebecca Caldwell
    abstract: The digital divide has historically separated individuals with reliable
      access to technology from those without it. As Artificial Intelligence (AI)
      becomes increasingly integrated into education, healthcare, business, cybersecurity,
      and workforce development, this divide is expanding into what can be described
      as an “AI divide.” Individuals in lower socioeconomic communities often lack
      the technological infrastructure, high-speed broadband access, digital literacy
      skills, and institutional support necessary to effectively utilize AI tools.
      In contrast, higher-income communities benefit from stronger internet connectivity,
      updated hardware, and educational programs that introduce students to emerging
      technologies. AI systems depend on fast data processing, cloud computing resources,
      and stable broadband connections to function efficiently. However, high-speed
      internet services are disproportionately available in urban and suburban areas,
      while many rural and underserved communities experience slower and less reliable
      connectivity. This infrastructure gap directly limits access to AI-powered applications
      used for learning, job training, and economic advancement. Educational disparities
      further intensify the problem. Underserved schools often lack funding for advanced
      computer science courses, AI literacy programs, and updated technological equipment.
      Without early exposure to AI concepts and skills, students may be unprepared
      for a workforce increasingly shaped by automation and machine learning. As AI
      expands across industries and begins to automate certain job functions, individuals
      without access or training risk long-term economic disadvantage. This study
      examines how infrastructure inequality, limited AI education, and insufficient
      institutional support may widen socioeconomic gaps in the era of artificial
      intelligence. It also explores policy and educational strategies designed to
      promote equitable access to AI technologies and workforce opportunities.
  - title: Denoising and Object Tracking in Adverse Conditions
    submission_id: 72
    pdf: sorted_papers/Poster/Student%20-%20Undergraduate/ADMI_2026_paper_72.pdf
    bib: admi2026_bib/Harrigan2026denoisingobjecttracking.bib
    submission_type: Poster
    author_category: Student - Undergraduate
    authors: Saniya Harrigan, Saurav Aryal and Gloria Washington
    abstract: The goal of the VISTAC challenge is to improve visual object tracking
      under adverse weather conditions. While advanced tracking technologies perform
      well in controlled and well-lit environments, their performance decreases significantly
      in challenging conditions such as haze and rain. This limitation is critical
      because real-world applications, like traffic monitoring systems and autonomous
      vehicles, must operate reliably in unpredictable environmental settings. The
      challenge aims to develop robust tracking algorithms capable of maintaining
      accuracy and consistency in harsh environments. This research investigates the
      effectiveness of different image denoising and filtering techniques for improving
      object tracking performances in degraded visual conditions. Using annotated
      video data containing hazy and rainy scenes, multiple preprocessing methods
      are applied to enhance frame clarity before tracking. The impact of each denoising
      technique is evaluated based on visual quality, feature preservation, and tracking
      performance metrics such as Qualitative Precision (QP) and effective frames
      per second.
  - title: The Impact of AI-Integrated Pre-College Bridge Program on First-Year Student
      Success
    submission_id: 75
    pdf: sorted_papers/Poster/Student%20-%20Undergraduate/ADMI_2026_paper_75.pdf
    bib: admi2026_bib/Borden2026impactaiintegrated.bib
    submission_type: Poster
    author_category: Student - Undergraduate
    authors: Jalia Borden, Bianca Robinson, Rebecca Caldwell and Jacqueline Bethea
    abstract: The transition from high school to college can be challenging for many
      students. College classes are more demanding, schedules are less structured,
      and students must learn to manage their time independently. Many students also
      feel nervous about meeting new people and adjusting to a new academic environment.
      To support this transition, many colleges offer pre-college bridge programs
      that prepare incoming students before their first semester begins. Bridge programs
      focus on building important skills such as time management, study habits, and
      critical thinking. In our bridge experience, Artificial Intelligence (AI) tools
      were also introduced as part of academic preparation. We explored how to use
      AI responsibly to assist with studying, brainstorming ideas, understanding assignments,
      and practicing problem-solving. Learning how to use AI as a support tool could
      help freshmen feel more prepared for college-level coursework and more confident
      in completing assignments. The program bridge provided opportunities to connect
      with other incoming freshmen and mentors, which could reduced anxiety and helped
      us build early friendships. In this study, we reflect on how the bridge program—along
      with guided AI use—improved my academic readiness, confidence, and sense of
      belonging during our first year. Overall, this experience showed that combining
      traditional bridge support with responsible AI integration can strengthen both
      academic success and student confidence during the transition to college.
  - title: CULTURALLY AWARE MULTILINGUAL MODEL ROUTING THROUGH A MIXTURE-OF-SPECIALISTS
      FRAMEWORK
    submission_id: 76
    pdf: sorted_papers/Poster/Student%20-%20Undergraduate/ADMI_2026_paper_76.pdf
    bib: admi2026_bib/Adjei2026culturallyawaremultiling.bib
    submission_type: Poster
    author_category: Student - Undergraduate
    authors: Isaac Adjei, Saurav Aryal and Legand Burge
    abstract: Large language models (LLMs) continue to underperform for culturally
      diverse and linguistically underrepresented communities, limiting their applicability
      in multilingual and code-switched environments. This work introduces a culturally
      aware Mixture of Specialists (MoS) framework coordinated by a Model Control
      Protocol (MCP) server to dynamically route user inputs to language- or region-specific
      models based on linguistic proximity, cultural relatedness, and data availability.
      When a dedicated specialist exists, it is used directly; otherwise, a hierarchical
      fallback strategy selects a linguistically related model, then a culturally
      proximate variant such as a West African English–tuned specialist, and finally
      a multilingual backbone augmented with lightweight regional adapters. As part
      of a multi-phase research program, this paper presents the first stage of the
      system, focusing on the routing architecture, cultural metadata extraction,
      and region-aware prompting components while specialist model training is ongoing.
      To support future specialization, we prepare parameter-efficient fine-tuning
      pipelines (LoRA and QLoRA) using openly licensed corpora rich in local context,
      including OSCAR, mC4, BigScience ROOTS, Tatoeba, African StoryBooks, and Global
      Voices, with thorough deduplication, filtering, and native-speaker validation.
      Evaluation on the BLEnD benchmark from SemEval 2026 Task 7 across 26 languages
      and 30 regions demonstrates that culturally grounded routing signals, regional
      metadata, and language-specific constraints yield substantial gains in contextual
      accuracy, robustness in low-resource settings, and cross-regional generalization.
      These Phase-1 results provide early empirical evidence that linguistic relatedness
      and cultural proximity can meaningfully enhance multilingual model performance
      even before full specialist integration. Overall, this work establishes a scalable
      foundation for developing globally adaptive and culturally grounded NLP systems.
  - title: ASR Benchmarking for AAVE
    submission_id: 77
    pdf: sorted_papers/Poster/Student%20-%20Undergraduate/ADMI_2026_paper_77.pdf
    bib: admi2026_bib/Akomoize2026asrbenchmarkingaave.bib
    submission_type: Poster
    author_category: Student - Undergraduate
    authors: Mildness Akomoize, Saurav Aryal and Gloria Washington
    abstract: Automatic speech recognition (ASR) systems are widely used in voice
      assistants, transcription services, and accessibility tools, yet prior research
      suggests they perform unevenly across dialects. This project investigates performance
      disparities in commercial ASR systems for African American Vernacular English
      (AAVE). We curated and transcribed over 200 hours of question–response style
      AAVE speech data and split it into training, validation, and test sets. Using
      an automated benchmarking pipeline, we evaluate systems including OpenAI Whisper,
      Amazon Transcribe, and Deepgram. Performance is measured using Word Error Rate
      (WER), with statistical analyses such as Welch’s t-test and Shapiro–Wilk tests
      applied to assess significance and distributional assumptions. Preliminary findings
      indicate that several commercial systems exhibit elevated WER on AAVE speech
      relative to reported general benchmarks. To address this gap, we are fine-tuning
      models on the curated dataset and observing reductions in WER, though this phase
      remains ongoing. By combining systematic benchmarking, statistical rigor, and
      dataset development, this work contributes toward more equitable and representative
      speech recognition technologies
  - title: 'The Importance of Adversarial Patch Detection in Cybersecurity Attacks:
      A Critical Analysis of Machine Learning Vulnerabilities and Defense Mechanisms'
    submission_id: 78
    pdf: sorted_papers/Poster/Student%20-%20Undergraduate/ADMI_2026_paper_78.pdf
    bib: admi2026_bib/Johnson2026importanceadversarialpat.bib
    submission_type: Poster
    author_category: Student - Undergraduate
    authors: Josiah Johnson, E. Rebecca Caldwell and Elva Jones
    abstract: Adversarial patch detection represents a critical frontier in cybersecurity
      defense. As artificial intelligence systems assume greater responsibility in
      safety-critical and security-sensitive applications, the ability to detect and
      neutralize adversarial attacks becomes paramount. As artificial intelligence
      systems become increasingly woven into the fabric of critical infrastructure—impacting
      areas such as autonomous vehicles, facial recognition technologies, medical
      diagnostics, and financial fraud detection—their vulnerability to adversarial
      patch attacks takes on a new level of significance, posing a considerable and
      escalating cybersecurity threat. Adversarial patches are intricately designed
      perturbations, whether physical objects or digital modifications, crafted with
      precision to deceive AI vision systems. These deceptive alterations can manipulate
      the system&#x27;s perception and decision-making processes, resulting in erroneous
      classifications. Such manipulation can empower malicious actors to bypass established
      security measures, take control of autonomous operations, or elude detection
      mechanisms, potentially leading to catastrophic consequences. This research
      carefully examines the urgent necessity for adversarial patch detection as an
      essential component of a comprehensive defensive strategy within the cybersecurity
      landscape. It explores the increasing sophistication of current adversarial
      attack methodologies, which often exploit subtle vulnerabilities in AI algorithms
      with alarming effectiveness. Moreover, the study investigates the capabilities
      of emerging detection frameworks that aim to identify, analyze, and mitigate
      these sophisticated threats. By exploring the dynamic relationship between advancing
      adversarial tactics and the evolving defense mechanisms, this work seeks to
      illuminate strategies to bolster the resilience of AI systems against these
      insidious attacks, thereby enhancing the safety and reliability of critical
      infrastructure in a rapidly evolving digital landscape.
  - title: Detecting Physical Adversarial Patch Attacks with Object Detectors
    submission_id: 80
    pdf: sorted_papers/Poster/Student%20-%20Undergraduate/ADMI_2026_paper_80.pdf
    bib: admi2026_bib/Washington2026detectingphysicaladversa.bib
    submission_type: Poster
    author_category: Student - Undergraduate
    authors: Damone Washington and Rebecca Caldwell
    abstract: Deep learning-based object detection technologies, such as YOLOv5 and
      Faster R-CNN, are being increasingly applied in safety-critical areas, including
      self-driving cars, surveillance systems, and smart transportation infrastructure.
      Although these models show remarkable performance under standard conditions,
      they are vulnerable to physical adversarial patch attacks. These attacks involve
      the careful placement of specifically designed printed perturbations in a scene
      to provoke misclassification or to obscure objects. In contrast to digital attacks
      that take place in controlled settings, physical adversarial patches operate
      under real-world conditions, where variables such as changing light, distance,
      angle, and occlusion can greatly influence their effectiveness, making them
      a significant danger. This study explores detection-based defense mechanisms
      designed to identify physical adversarial patch attacks using object detectors.
      We assess various methods, including confidence-score analysis, monitoring of
      bounding-box instability, feature-distribution anomaly detection, and ensemble-based
      detection strategies. To simulate realistic deployment scenarios, researchers
      collected a controlled dataset of both clean and patched objects under various
      environmental conditions. The detection performance is evaluated using precision,
      recall, F1-score, mean Average Precision (mAP), and inference latency. Early
      investigation of research studies suggests that the use of ensemble detection,
      along with tracking confidence distributions, significantly improves the detection
      rates of adversarial patch attacks while keeping performance near real-time
      levels. This research focuses on identifying, rather than stopping, physical
      adversarial patch attacks using object detection-based defense strategies.
  - title: 'Structural Augmentation for Conspiracy Detection: A ModernBERT Approach
      to PsyCoMark 2026 Subtask 2'
    submission_id: 81
    pdf: sorted_papers/Poster/Student%20-%20Undergraduate/ADMI_2026_paper_81.pdf
    bib: admi2026_bib/Baddol2026structuralaugmentationco.bib
    submission_type: Poster
    author_category: Student - Undergraduate
    authors: Lashaun Baddol, Saurav Aryal and Lashaun Baddol
    abstract: The PsyCoMark 2026 shared task emphasizes modeling the psycholinguistic
      structure underlying conspiracy belief expression rather than relying solely
      on topical cues. In this work, we address Subtask 2, which requires classifying
      Reddit comments as conspiracy-related or non-conspiracy-related across diverse
      domains. We implement a syntactically augmented transformer-based classifier
      using ModernBERT-base. To introduce lightweight structural information aligned
      with PsyCoMark’s theoretical framing, we extract Part-of-Speech (POS) tags using
      spaCy and concatenate the resulting syntactic sequence with the original comment
      text via a separator token. This approach allows the model to jointly encode
      lexical semantics and shallow grammatical structure without architectural modification.
      The model is fine-tuned for binary classification using cross-entropy loss,
      with early stopping applied to reduce overfitting. Preliminary experiments on
      the official development split yield a macro-averaged F1 score of 0.46. While
      performance remains modest, these results establish a functional baseline for
      structurally augmented classification and provide initial insight into the contribution
      of shallow syntactic signals for conspiracy detection in topic-diverse online
      discussions. This work contributes an empirically grounded starting point for
      exploring psycholinguistically informed transformer models within the PsyCoMark
      framework.
  - title: Evaluating Perceptions of Naturalness in AI-Generated Speech
    submission_id: 82
    pdf: sorted_papers/Poster/Student%20-%20Undergraduate/ADMI_2026_paper_82.pdf
    bib: admi2026_bib/Anyamele2026evaluatingperceptionsnat.bib
    submission_type: Poster
    author_category: Student - Undergraduate
    authors: Ogechi Anyamele, Saurav Aryal and Gloria Washington
    abstract: 'Advances in neural text-to-speech technologies have allowed for realistic
      voice cloning, however, determining how “natural” synthetic voices are remains
      a challenge. As voice cloning becomes more integrated into applications such
      as accessibility systems, entertainment platforms, virtual assistants, and more,
      the quality of synthetic speech becomes increasingly significant. Subtle differences
      can shape listeners&#x27; attitudes towards usability, reduce trust, and affect
      overall user experience. Therefore, identifying factors that contribute to human-like
      speech and establishing reliable methods to evaluate perceived naturalness is
      essential in advancing speech synthesis systems. This study investigates the
      relationship between training data quantity and perceived human-likeness in
      cloned voices using a neural voice cloning pipeline based on Coqui XTTS. An
      end-to-end voice cloning system was implemented, with voice models trained on
      speech samples of varying lengths. Synthetic speech outputs were generated from
      each model and evaluated through a qualitative listening study. The generated
      voice samples were assessed by three human evaluators: self, familiar, and unfamiliar
      listeners. Evaluators rated each sample on a five-point Likert scale for perceived
      naturalness. Ratings were compiled into a structured dataset for comparative
      analysis. Additionally, different approaches for evaluating speech naturalness
      were explored to inform the study design. Thus far, the end-to-end system has
      been implemented, models have been trained under varying data conditions, and
      listening evaluations have been conducted to support ongoing analysis. Together,
      these components establish a systematic framework for examining how training
      data quantity relates to perceived naturalness in synthetic speech, offering
      a foundation for further refinement in voice cloning applications.'
  - title: Cross-Silo Federated Learning for Radiomics
    submission_id: 84
    pdf: sorted_papers/Poster/Student%20-%20Undergraduate/ADMI_2026_paper_84.pdf
    bib: admi2026_bib/Tucker2026crosssilofederated.bib
    submission_type: Poster
    author_category: Student - Undergraduate
    authors: Anthony Tucker and Saurav Keshari Aryal
    abstract: Radiomics allows for the extraction of features from medical images
      for predictive modeling, but due to data privacy regulations, training models
      on multi-institutional datasets is not feasible. We propose a cross-silo federated
      learning framework that allows hospitals to jointly train radiomics models without
      sharing patient data. Our solution utilizes the Flower framework and the radMLBench
      benchmark (50+ radiomics datasets) to create a multi-hospital federated learning
      setting. Each hospital is given unique datasets, as seen in real-world settings.
      We handle feature heterogeneity by using intersection-based feature alignment,
      making the model compatible across hospitals. The framework utilizes a four-layer
      neural network architecture that is trained locally at each hospital. The central
      server combines the model parameters using Federated Averaging (FedAvg), weighted
      by the number of samples. We compare the federated learning method with a centralized
      approach that trains on aggregated data using accuracy as a metric. Although
      the centralized approach has the advantage of direct access to all the data,
      the federated approach is able to attain similar results while preserving the
      privacy of the data, thus proving that collaborative learning can come close
      to the centralized approach without breaching the privacy constraints. The framework
      is applied to brain-related disorders (gliomas and glioblastomas) using MRI
      images, thus illustrating how different institutions can work together to collaboratively
      enhance the performance of the model while being HIPAA compliant.
  - title: 'AI4PC-Howard University at SemEval-2026 Task 9: Multilingual Polarization
      Detection via Large Language Model Inference'
    submission_id: 89
    pdf: sorted_papers/Poster/Student%20-%20Undergraduate/ADMI_2026_paper_89.pdf
    bib: admi2026_bib/Aryal2026ai4pchowarduniversity.bib
    submission_type: Poster
    author_category: Student - Undergraduate
    authors: Surangana Aryal, Saurav Keshari Aryal and Soluchi Fidelibeab
    abstract: 'This paper describes the PolarNLP system submitted to SemEval-2026
      Task 9, Subtask 1, which focuses on detecting political polarization in multilingual
      text. The task spans 22 typologically diverse languages and poses challenges
      related to domain shift, class imbalance, and cross-lingual generalization.
      We explored two modeling strategies: (i) a weakly supervised teacher–student
      approach that uses a large language model (LLM) to generate pseudolabels for
      training a multilingual classifier, and (ii) direct LLM-based inference augmented
      with language-agnostic stylistic features. While the teacher–student approach
      achieved reasonable in-distribution performance, it failed to generalize to
      the heldout test set, collapsing toward the majority class. Consequently, our
      final submission relies on direct LLM inference. We present a detailed analysis
      of both approaches, highlighting the limitations of weak supervision for polarization
      detection and the relative robustness of direct LLM reasoning in multilingual
      settings.'
