    author_category: Faculty
    authors: Yan Xu
    abstract: Hyperspectral image (HSI) classification relies on high-dimensional
      spectral signatures, often leading to the curse of dimensionality and high computational
      cost. Most existing methods attempt to mitigate this by selecting dozens of
      bands; in this paper, we propose a highly efficient framework that uses only
      three spectral bands. To maximize the information extracted from this minimal
      spectral subset, we employ a 3D Convolutional Neural Network (3D-CNN) to capture
      joint spatial-spectral features. We investigate the efficacy of Noise-Adjusted
      Principal Component Analysis (NAPCA) as a dimensionality reduction tool, comparing
      it against standard Principal Component Analysis (PCA), Incremental PCA, unsupervised
      and supervised band selection methods. Furthermore, we implement a spatial data
      augmentation strategy by integrating rotations and flips to artificially expand
      the training set and improve model generalization. Experimental results on three
      real-world HSI datasets show that the proposed approach outperforms other state-of-the-art
      methods. This approach provides a robust solution for resource-constrained remote
      sensing applications.
  - title: Using Personalized Generative AI as a “First Responder” in C++ Education
      to improve student learning
    pdf: sorted_papers/Full-Oral/Faculty/ADMI_2026_paper_73.pdf
    bib: admi2026_bib/Dennis2026personalizedgenerativeai.bib
    submission_type: Full-Oral
    author_category: Faculty
    authors: Sonya Dennis and Juana Mendenhall
    abstract: Using Generative AI in the classroom to improve student learning requires
      deliberate, structured integration into course activities and assessments. This
      paper explores the integration of a specialized Generative AI mentor, Dennis
      AI, into three sections of an undergraduate Computer Programming II course.
      The mentor was developed in conjunction with ibl.ai, a family-owned and operated
      company located in the technological hub of New York that specializes in building
      AI-driven, revenue-generating systems for the educational sector, serving learners
      from over 400 universities. The research evaluates a pedagogical shift from
      traditional passive learning to an active, generative model where AI serves
      as a &quot;First Responder&quot; for complex technical concepts like memory
      management and object-oriented design. By leveraging the ibl.ai platform to
      synthesize course-specific data, the study demonstrates how structured prompt-based
      inquiry and iterative code generation can bridge the &quot;complexity wall&quot;
      often encountered in mid-level computer science curricula[1]. Furthermore, the
      study illustrates how the integration of AI mentors and digital avatars---mapped
      to Bloom&#x27;s Taxonomy 4.0---facilitates a scalable model for high-level architectural
      mentoring and diagnostic practice[2]. Ultimately, this study posits that the
      strategic deployment of specialized Generative AI tools creates a dynamic environment
      that encourages deep inquiry, competitive innovation, and a rigorous validation
      process that preserves academic integrity.
  - title: 'The Importance of Course Redesign: Microlearning Strategies for Enhanced
      Course Design: Insights from the JCSU CITL Summer Workshop'
    pdf: sorted_papers/Full-Oral/Faculty/ADMI_2026_paper_74.pdf
    bib: admi2026_bib/Worrell2026importancecourseredesign.bib
    submission_type: Full-Oral
    author_category: Faculty
    authors: Sonya Worrell
    abstract: This article explores innovative course design strategies aimed at enhancing
      student engagement and learning retention, informed by insights gained during
      the JCSU CITL Summer Course Design Workshop held from June 2nd to the 4th, 2025.
      Specifically tailored for STEM faculty, the workshop emphasized integrating
      microlearning techniques, modular course structures, and establishing instructor
      presence. This paper discusses key takeaways, practical strategies, and the
      implications of these approaches for improving educational experiences.
  - title: Developing Effective Computer Science Program Curricula and AI-Driven Educational
      Models to Enhance Learning Outcomes
    pdf: sorted_papers/Full-Oral/Faculty/ADMI_2026_paper_79.pdf
    bib: admi2026_bib/Nam2026developingeffectivecompu.bib
    submission_type: Full-Oral
    author_category: Faculty
    authors: Deok Nam
    abstract: The rapid evolution of artificial intelligence (AI) and computing technologies
      has fundamentally reshaped workforce demands, necessitating a transformation
      in how computer science (CS) education is designed and delivered. Traditional
      CS curricula often struggle to keep pace with industry innovation, provide personalized
      learning experiences, and equitably support diverse learner populations. This
      paper presents a comprehensive framework for developing effective computer science
      program curricula integrated with AI-driven educational models to enhance student
      learning outcomes. The proposed approach aligns curriculum design with competency-based
      education, industry relevance, and adaptive AI technologies such as intelligent
      tutoring systems, learning analytics, and personalized content recommendation.
      Through curriculum mapping, instructional design models, and AI-enabled assessment
      strategies, the paper demonstrates how AI can improve student engagement, mastery,
      retention, and employability. A case-based implementation model and evaluation
      metrics are presented to guide institutions in adopting scalable, ethical, and
      inclusive AI-enhanced CS education.
  - title: Findings from a Feasibility Study on AI-Aligned Experiential Learning at
      an HBCU
    pdf: sorted_papers/Full-Oral/Faculty/ADMI_2026_paper_91.pdf
    bib: admi2026_bib/Shumba2026findingsfeasibilitystudy.bib
    submission_type: Full-Oral
    author_category: Faculty
    authors: Rose Shumba
    abstract: Building a pathway from AI coursework to AI careers requires a clear
      understanding of what students experience between the classroom and the job
      market. This paper reports results from a feasibility study supported by the
      University System of Maryland Elkins Transformation Award at Bowie State University
      (BSU). The study examined barriers to student participation in AI-aligned experiential
      learning and assessed institutional readiness for scaling career-connected learning.
      The feasibility study gathered input from 200 students, 15 faculty members,
      and 10 industry partners to assess constraints, capacity, and partnership needs
      for expanding AI-aligned experiential learning. We describe the study methods
      and key findings, then discuss what they suggest about the importance of experiential
      learning centers as a strategy for strengthening AI workforce preparation at
      HBCUs. The work builds on several years of experiential learning work, including
      a Tech Pipeline Program featured in The New York Times describing how BSU developed
      employer partnerships to strengthen student career outcomes.
  - title: 'Building the Next Generation of Cyber AI Professionals: Lessons from Bowie
      State University’s CyberAI Scholarship For Service Program'
    pdf: sorted_papers/Full-Oral/Faculty/ADMI_2026_paper_92.pdf
    bib: admi2026_bib/Shumba2026buildingnextgeneration.bib
    submission_type: Full-Oral
    author_category: Faculty
    authors: Rose Shumba
    abstract: The CyberAICorps Scholarship for Service (CyberAI SFS), formerly the
      CyberCorps® Scholarship for Service (SFS), supports cybersecurity education
      in exchange for post-graduation government service. This paper describes Bowie
      State University’s CyberAI SFS program and shares early lessons from implementation
      since 2023. The program has supported 14 scholars and has strengthened recruitment
      by offering a funded, structured pathway into government cybersecurity careers.
      We summarize the student experience and program operations, including cohort
      support, mentoring, professional development, certifications preparation, research
      and conference participation, and structured preparation for internships and
      government employment. We report outcomes in aggregate, including internship
      placements and early cybersecurity-related government employment, and highlight
      the operational choices that helped students participate fully while meeting
      program requirements. The paper concludes with takeaways for HBCUs exploring
      CyberAI SFS participation and an invitation to an April 2026 virtual workshop
      for institutions interested in joining as mentoring partners and building toward
      future readiness.
