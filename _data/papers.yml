  - title: A Hands-On Laboratory Approach to Supporting Student Learning in Computer
      Vision Education
    pdf: sorted_papers/Full-Oral/Student%20-%20Graduate/ADMI_2026_paper_20.pdf
    bib: admi2026_bib/Thomas2026handslaboratoryapproach.bib
    submission_type: Full-Oral
    author_category: Student - Graduate
    authors: Terrelle Thomas, Idongesit Mkpong-Ruffin, Chutima Boonthum-Denecke and
      Deidre Evans
    abstract: As artificial intelligence increases and is used in daily life activi-ties,
      the need to understand and interact with artificial intelligence has become
      important and is now emphasized in undergraduate and graduate programs. Even
      though AI is being taught, some top-ics such as computer vision (DETR, YOLOv8,
      Faster R-CNN, and SSD) remain difficult for students to understand and incorporate
      into practice. Without a definite percentage indicating how many students are
      affected, current discussions continue to show that computer vision is one of
      the topics learners struggle to grasp [3]. To address these challenges, a structured
      framework of hands-on labs in computer vision can support students in strengthening
      their comprehension at both undergraduate and graduate levels. A hands-on lab
      is a structured learning activity in which students actively perform tasks,
      experiments, or problem-solving activities using tools, technologies, or data
      rather than relying solely on lec-tures. This experiential approach requires
      learners to interact with software, equipment, or real-world datasets to apply
      theoretical concepts in a practical context. Hands-on labs help students un-derstand
      complex AI and computer vision topics by transforming abstract concepts such
      as convolution, feature extraction, and ob-ject detection pipelines into concrete,
      interactive experiences that enhance understanding. By working directly with
      detection mod-els like YOLO, SSD, Faster R-CNN, and DETR, students develop stronger
      intuition, reduce cognitive overload, and build practical skills needed to apply
      these systems in real-world scenarios. Prior research in computing and engineering
      education indicates that project-based and hands-on learning approaches significantly
      im-prove student comprehension, engagement, and overall learning outcomes [4].
  - title: 'Investigating Motion-Focused Video Frame Interpolation: Efficiency vs.
      Fidelity'
    pdf: sorted_papers/Full-Oral/Student%20-%20Graduate/ADMI_2026_paper_23.pdf
    bib: admi2026_bib/Mendoza2026investigatingmotionfocus.bib
    submission_type: Full-Oral
    author_category: Student - Graduate
    authors: Carlos Sac Mendoza, Lily Liang and Briana Wellman
    abstract: A significant challenge in Video Frame Interpolation (VFI) is reducing
      the processing time without significantly sacrificing visual quality. To address
      it, we developed a computationally efficient motion-focused VFI methodology,
      based on Google&#x27;s FILM (Frame Interpolation for Large Motion) model. Our
      proposed approach, Motion-focused FILM, selectively interpolates only the most
      dynamic areas of the video to reduce the computational load and processing time.
      We also implemented a tensor bucketing strategy to reduce computational overhead.
      We evaluated our approach on the DAVIS 2017 dataset. The results show a 95%
      reduction in processing time compared to the full-frame method. It achieved
      a Peak Signal-to-Noise Ratio (PSNR) score that was approximately 88% of the
      baseline, indicating a discernible loss in pixel-level fidelity. However, it
      retained over 87% of the structural similarity (SSIM) test, suggesting that
      the overall structure of the interpolated image remains mostly intact. We also
      investigated the impact of video resolution on our approach&#x27;s performance.
  - title: Integrating Blockchain dApp Development in Cybersecurity Education via
      Real-World Applications
    pdf: sorted_papers/Full-Oral/Student%20-%20Graduate/ADMI_2026_paper_51.pdf
    bib: admi2026_bib/Carter2026integratingblockchaindap.bib
    submission_type: Full-Oral
    author_category: Student - Graduate
    authors: Javonte Carter, Inioluwa Kola-Adelakin, Jerry Miller and Hongmei Chi
    abstract: This paper presents a structured pedagogical framework for integrating
      blockchain decentralized application (dApp) development into cybersecurity education
      through experiential, project-based learning. The framework is implemented via
      a series of laboratory modules that immerse students in authentic, project-based
      activities grounded in real-world use cases, including blockchain-based diploma
      and transcript verification, cryptocurrency (Bitcoin) forensic analysis, and
      secure supply chain management. Through these activities, students gain practical
      exposure to distributed systems, smart contracts, and security mechanisms within
      blockchain environments. Preliminary classroom outcomes demonstrate increased
      student interesting in learning dApp development, enhanced conceptual understanding
      of blockchain and cybersecurity principles, and improved preparedness for industry
      and research-oriented roles. Overall, the proposed framework aims to (1) strengthen
      students’ skills and awareness of blockchain source code vulnerabilities, along
      with associated detection and mitigation techniques; (2) systematically integrate
      blockchain vulnerability concepts into information technology and cybersecurity
      curricula; and (3) prepare future IT professionals with a solid understanding
      of blockchain attack surfaces and defensive strategies in real-world contexts.
  - title: 'FORGETTING BY DESIGN: TESTING THE EFFECTIVENESS OF MACHINE UNLEARNING
      IN RIGHT TO BE FORGOTTEN DATA DELETION'
    pdf: sorted_papers/Full-Oral/Student%20-%20Graduate/ADMI_2026_paper_6.pdf
    bib: admi2026_bib/Guy2026forgettingdesigntesting.bib
    submission_type: Full-Oral
    author_category: Student - Graduate
    authors: Jericka Guy and Chutima Boonthum-Denecke
    abstract: The Right to Be Forgotten (RTBF) is a legal requirement that allows
      individuals to request the deletion of their personal data from digital systems.
      However, in modern machine learning environments, fully removing data is technically
      challenging once it has been incorporated into trained models. This research
      investigates whether machine unlearning can serve as an effective mechanism
      for supporting RTBF by removing the influence of specific data from a trained
      model. The study evaluates a pre-trained neural network using multiple forget
      set sizes and applies Membership Inference Attacks (MIA) to measure whether
      deleted data remains detectable after unlearning. Experimental results show
      that while machine unlearning preserves performance on retained data, it does
      not fully eliminate the influence of forgotten data, as residual information
      remains detectable across all tested configurations. These findings demonstrate
      that machine unlearning alone is insufficient to guarantee complete data deletion
      and highlight the need for stronger verification methods and complementary strategies
      to support RTBF compliance in AI systems.
  - title: SQL Injection Prevention Techniques
    pdf: sorted_papers/Full-Oral/Student%20-%20Graduate/ADMI_2026_paper_7.pdf
    bib: admi2026_bib/Darden2026sqlinjectionprevention.bib
    submission_type: Full-Oral
    author_category: Student - Graduate
    authors: Angela Darden and Chutima Boonthum-Denecke
    abstract: SQL injections are one of the most common and dangerous vulnerabilities
      found in web applications, even though they have been well documented for decades.
      This paper explores the effectiveness of common prevention techniques against
      SQL injection attacks, including input validation, parameterized queries, and
      prepared statements. To demonstrate, a vulnerable web environment was created
      using Damn Vulnerable Web Application (DVWA) to simulate attacks and observe
      how each defense method withstands different injection attempts. The results
      will show the strengths and weaknesses of each approach when tested against
      real-world attack patterns. In addition to testing, this research highlights
      the relevance of SQL injections in today’s cybersecurity environment, shown
      by their inclusion in the OWASP Top 10 [4]. By demonstrating how easily unsecured
      applications can become victims of attacks and how effective proper countermeasures
      can be, this paper highlights the importance of implementing secure coding practices
      in modern web development.
  - title: Advancing Digital Forensics with the Integration of Cyber Threat Intelligence
      Technologies
    pdf: sorted_papers/Full-Oral/Student%20-%20Graduate/ADMI_2026_paper_85.pdf
    bib: admi2026_bib/Longfor2026advancingdigitalforensic.bib
    submission_type: Full-Oral
    author_category: Student - Graduate
    authors: Frank Junior Hoza Longfor, Yohn J Parra Bautista, Adi Chauhan and Hongmei
      Chi
    abstract: This research project explores a novel approach to bolstering digital
      forensics by integrating AlienVault, a leading security platform, with blockchain
      technology. By harnessing the capabilities of AlienVault for real-time threat
      detection and incident response and leveraging the immutable nature of blockchain
      for data integrity, this study proposes a framework for enhancing the reliability
      of digital forensic investigations. The tools used include AlienVault’s Open-Source
      Security Information Management (OSSIM) platform for security information and
      event management (SIEM). Ethereum’s blockchain-based ledger is used to log events
      detected by AlienVault OSSIM, ensuring each event log entry is time-stamped.
      Data sources for this study include a controlled setup network and the Open
      Threat Research (OTRF) Security Dataset of Windows event logs. These sources
      provide a comprehensive and realistic range of cyber-attack scenarios. By utilizing
      these datasets, the research evaluates how well the integrated system can detect
      and store threat information. The system’s performance is assessed based on
      its accuracy in identifying attacks, the speed of its incident response, and
      the reliability of its forensic data. The expected result is a blockchain-enhanced
      forensic framework that mitigates common challenges in digital forensics, such
      as data tampering and chain of custody issues.
  - title: 'Bridging Policy and Practice: The CLASS AlignED Framework for Responsible
      AI Integration in Higher Education'
    pdf: sorted_papers/Full-Oral/Student%20-%20Graduate/ADMI_2026_paper_90.pdf
    bib: admi2026_bib/Harrell2026bridgingpolicypractice.bib
    submission_type: Full-Oral
    author_category: Student - Graduate
    authors: Joshua Harrell, Jeaime Powell, Dillon Moore, Qimora Mason, Suniyah Esey,
      Abraham Ashade, Linda Hayden and Mohamed Elbakary
    abstract: The rapid expansion of artificial intelligence (AI), high-performance
      computing (HPC), and Science Gateway technologies in higher education has created
      new opportunities for experiential learning while introducing complexity for
      faculty seeking structured and policy-compliant integration. This paper presents
      the CLASS AlignED (Course Learning &amp; Analytics Support System) Framework,
      a faculty-centered, governance-aware architecture designed to support the incorporation
      of AI, HPC, and Science Gateway technologies into undergraduate curricula. The
      framework connects institutional AI policy, structured instructional workflows,
      scalable computing infrastructure, and measurable learning analytics into a
      unified alignment model. Using a design-based research approach, we describe
      the conceptual model, system architecture, and planned prototype implementation.
      The framework proposes embedding compliance logic and cyberinfrastructure guidance
      directly within AI-assisted workflows to reduce faculty uncertainty and translate
      institutional policy into actionable instructional practice. CLASS AlignED offers
      a scalable model for institutions seeking to expand AI- and HPC-enabled instruction
      while maintaining governance, reproducibility, and equitable access to advanced
      cyberinfrastructure resources.
