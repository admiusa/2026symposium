  - title: EXPLORING CALCULUS CONCEPTS WITH MAPLE
    pdf: sorted_papers/Full-Oral/Faculty/ADMI_2026_paper_12.pdf
    bib: admi2026_bib/Velummylum2026exploringcalculusconcept.bib
    submission_type: Full-Oral
    author_category: Faculty
    authors: Somasundaram Velummylum
    abstract: In calculus, we study techniques for finding the maximum and minimum
      values of functions, as well as evaluating and visualizing volumes of solids
      of revolution formed by rotating regions bounded by graphs over given intervals
      about horizontal or vertical axes. These concepts will be explored through illustrative
      examples using MAPLE.
  - title: An Optimized Artificial Intelligence Powered iOS Mobile App for Weed Identification
    pdf: sorted_papers/Full-Oral/Faculty/ADMI_2026_paper_13.pdf
    bib: admi2026_bib/Biswal2026optimizedartificialintel.bib
    submission_type: Full-Oral
    author_category: Faculty
    authors: Biswajit Biswal and Jackson Edwards
    abstract: Weeds are a major burden in small and local farming communities in the
      United States due to the lack of technology, awareness, and education. Weed
      control is one of the biggest factors that affects crop production. Manual weeding
      gives maximum unique control of the weeds in the field. However, manual weeding
      has high labor intensity and high labor costs. This makes weed management difficult
      for small and local farmers in the state of South Carolina, resulting in loss
      of crop yield and poor quality production. In this work, the AI-based iOS mobile
      app is used to identify weed plants. In our work, we have successfully implemented
      an iOS mobile app to capture a weed image and identifies weed-type using CNN,
      CreateML, Xcode and Swift programming language. Our model was tested with our
      database of weed plants with a precision of 96%. Our results show that the iOS
      mobile app developed successfully identifies the weed plant. Our future work
      will include testing the iOS mobile app with more weed plant data to provide
      precise weed identification.
  - title: Enhancing Computer Science Education through AI-Driven Scaffolding
    pdf: sorted_papers/Full-Oral/Faculty/ADMI_2026_paper_24.pdf
    bib: admi2026_bib/Czejdo2026enhancingcomputerscience.bib
    submission_type: Full-Oral
    author_category: Faculty
    authors: Denny Czejdo
    abstract: This paper presents a methodology for utilizing Large Language Models
      (LLMs) to create AI-driven scaffolding materials in Computer Science. As enrollment
      in online and hybrid courses grows, the capacity for instructors to provide
      individual guidance to learners diminishes. This study introduces the &quot;A-H
      Pedagogical Framework,&quot; grounded in cognitive load theory and scaffolding
      principles. The methodology utilizes a Human-in-the-Loop AI workflow to analyze
      legacy educational materials (e.g., Jupyter Notebooks, PDFs), identify content
      and delivery method, and then propose improvements based on the &quot;A-H Pedagogical
      Framework.&quot; Through a case study of GIS Data-Processing assignments, this
      framework demonstrates how AI can enhance student learning by providing step-by-step,
      scaffolded guidance while reducing instructors&#x27; workload. The AI-driven
      approach enables scalable education and fosters learning experiences that are
      otherwise unattainable in large online classes.
  - title: Robust Noise-Resilient Feature Extract and 3D-CNN classification for Hyperspectral
      imagery
    pdf: sorted_papers/Full-Oral/Faculty/ADMI_2026_paper_25.pdf
    bib: admi2026_bib/Xu2026robustnoiseresilient.bib
    submission_type: Full-Oral
    author_category: Faculty
    authors: Yan Xu
    abstract: Traditional hyperspectral image (HSI) classification relies on high-dimensional
      spectral signatures, often leading to the curse of dimensionality and high computational
      cost. Most existing methods attempt to mitigate this by selecting dozens of
      bands; In this paper, we propose a highly efficient framework restricted to
      only three spectral bands. To maximize the information extracted from this minimal
      spectral subset, we employ a 3D Convolutional Neural Network (3D-CNN) to capture
      joint spatial-spectral features. We investigate the efficacy of Noise-Adjusted
      Principal Component Analysis (NAPCA) as a dimensionality reduction tool, comparing
      it against standard Principal Component Analysis (PCA), Incremental PCA, unsupervised
      and supervised band selection methods. Furthermore, we implement a spatial data
      augmentation strategy by integrating rotations and flips to artificially expand
      the training set and improve model generalization. Experimental results on three
      real-world HSI datasets show the proposed approach shows superior performance
      compared with other state-of-the-art methods. This approach indicates a robust
      solution for resource-constrained remote sensing applications.
  - title: Some experimental results for fingerprint image processing
    pdf: sorted_papers/Full-Oral/Faculty/ADMI_2026_paper_27.pdf
    bib: admi2026_bib/Zheng2026someexperimentalresults.bib
    submission_type: Full-Oral
    author_category: Faculty
    authors: Xiqiang Zheng
    abstract: Fingerprints offer a reliable and unique means of identification and
      hence are crucial in fields such as law enforcement and personal identification.
      However, fingerprint images are hardly of good quality. They may be corrupted
      and degraded with elements of noise owing to many issues including deviations
      in skin and impression circumstances. We test some commonly available fingerprint
      image processing codes and show some experimental results to see the progress
      and challenges of fingerprint image enhancement, segmentation and minutiae extraction.
  - title: Robust Noise-Resilient Feature Extraction and 3D-CNN Classification for
      Hyperspectral Imagery
    pdf: sorted_papers/Full-Oral/Faculty/ADMI_2026_paper_50.pdf
