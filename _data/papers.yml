  - title: 'Machine Learning-Based Detection of Business Email Compromise: A Comparative
      Analysis of Gradient Boosting Techniques'
    pdf: sorted_papers/Full-Oral/Student%20-%20Undergraduate/ADMI_2026_paper_1.pdf
    bib: admi2026_bib/Baning2026machinelearningbased.bib
    submission_type: Full-Oral
    author_category: Student - Undergraduate
    authors: Philip Baning
    abstract: Business Email Compromise (BEC) attacks constitute one of the most financially
      damaging cyber threats, resulting in global losses exceeding 2.7 billion USD
      annually according to the FBI Internet Crime Complaint Center. Unlike conventional
      phishing attacks that deploy malicious payloads or URLs, BEC employs sophisticated
      social engineering via carefully crafted language, posing substantial challenges
      to traditional signaturebased detection systems. This work develops a robust
      machine learning framework for automated BEC detection, incorporating 58 specialized
      features extracted from email content, metadata, and behavioral attributes.
      We provide a formal mathematical formulation of the feature extraction process
      and evaluate five gradient boosting algorithms—XGBoost, LightGBM, CatBoost,
      Random Forest, and a stacking ensemble on the Kaggle Fraud Email Dataset (9,239
      samples). The dataset undergoes an 80/20 stratified split to preserve class
      distribution. CatBoost attains the highest performance, with 97.29 percent accuracy,
      97.29 percent F1 score, and 99.55 percent AUC ROC. We employ McNemar’s test
      to confirm statistical significance (χ2 = 7.52, p &lt; 0.01) and utilize SHAP
      (SHapley Additive exPlanations) to isolate linguistic metrics specifically text
      entropy and readability—as primary discriminators. Furthermore, we present a
      computational complexity analysis demonstrating that our pipeline operates with
      O(L) linear complexity relative to email length, achieving sub 10 ms inference
      latency suitable for real time SIEM integration. The framework outperforms existing
      benchmarks by 8.8 percent in F1 score, establishing a new baseline for content
      centric threat detection.
  - title: Robots for Outreach
    pdf: sorted_papers/Full-Oral/Student%20-%20Undergraduate/ADMI_2026_paper_22.pdf
    bib: admi2026_bib/Stephens2026robotsoutreach.bib
    submission_type: Full-Oral
    author_category: Student - Undergraduate
    authors: Zora Stephens and Karina Liles
    abstract: Using Claflin University’s robots, we will program them to support our
      outreach efforts in computer science. The goal is to engage potential students
      and visitors with our computer science department through interactive demonstrations.
      A series of programs has been developed to illustrate the importance and diversity
      of computer science using the NAO humanoid and Unitree Go2 robots. These activities
      aim to instill basic computer science principles such as sequencing, conditional
      statements, sensor-based decision-making, and human-robot interaction. During
      outreach events, the robots perform demonstrations to help participants see
      how code translates into physical actions, demystifying programming, and robotics.
      By providing an interactive and visually engaging experience, computer science
      can be made more accessible to individuals with varying levels of technical
      background. This project demonstrates how robotics can be an effective tool
      for computer science outreach, increasing engagement, encouraging curiosity,
      and fostering interest in computing disciplines.
  - title: Enabling safe Beyond Visual Line of Sight Drone Operations of Sight Drone
      Operations Through AI-Powered Object Detection
    pdf: sorted_papers/Full-Oral/Student%20-%20Undergraduate/ADMI_2026_paper_28.pdf
    bib: admi2026_bib/Hopson2026enablingsafebeyond.bib
    submission_type: Full-Oral
    author_category: Student - Undergraduate
    authors: Aniya Hopson and Chutima Boonthum-Denecke
    abstract: As Artificial Intelligence (AI) becomes a powerful force within the
      technological field it is being integrated into all fields. As AI improves,
      optimizing it for everyday life is beneficial for the further development of
      technology. In this paper, we present our research findings and literature on
      adversarial examples and object detection. This research builds upon the previous
      work by investigating and optimizing an unmanned aircraft to be flown with the
      aid of Artificial Intelligence. We started with classifying and training AI
      to recognize certain objects on YOLOv11 custom trained models. Then a follow-up
      using the custom trained model with live drone footage to test the accuracy
      of the model evaluating how it can be utilized in Beyond Visual Line of Sight
      (BVLOS). Through this exploration it demonstrates the future of using unmanned
      aircrafts with support from machine learning.
  - title: AI and Automation in Sports
    pdf: sorted_papers/Full-Oral/Student%20-%20Undergraduate/ADMI_2026_paper_4.pdf
    bib: admi2026_bib/Grimes2026aiautomationsports.bib
    submission_type: Full-Oral
    author_category: Student - Undergraduate
    authors: Ryan Grimes, Jean Muhammad and Chutima Boonthum-Denecke
    abstract: Artificial Intelligence (AI) and automation has been one of the most
      popular topics of the century. It has been integrated into education, medicine,
      and transportation to make tasks easier and increase productivity. AI and automation
      is constantly being discussed for being a double edged sword. On one side, it
      makes tasks capable of being completed faster and oftentimes more accurate,
      but the other side argues that it lacks accountability. Before AI and automation
      is introduced to a system , it is integral to analyze the pros and cons of said
      implementation. This research focuses on the integration of AI and automation
      in sports and how its risks can affect athlete data, match outcomes, and device
      reliability. Past research has examined accuracy and health benefits; however,
      device security, data flow, and contingency planning in the event of an attack
      or breach has not been acknowledged. This study investigates these gaps by examining
      how AI-driven wearables and automated officiating systems function; how data
      flow is mapped; and what vulnerabilities affect confidentiality, integrity,
      and availability. Literature reviews and input from sports management and computer
      science professionals, athletes, and trainers will illustrate what protections
      are currently available and what they think of the trade-offs. The results will
      highlight key risks, identify potential solutions, and offer guidance for sports
      organizations and tech developers so that AI and automation in sports can be
      both innovative and secure.
  - title: Budget Aware Tracerouting
    pdf: sorted_papers/Full-Oral/Student%20-%20Undergraduate/ADMI_2026_paper_45.pdf
    bib: admi2026_bib/Diyaolu2026budgetawaretracerouting.bib
    submission_type: Full-Oral
    author_category: Student - Undergraduate
    authors: Bakri Diyaolu, Adin Lindsey and Jeremiah Adderley
    abstract: Traditional traceroute tools send a fixed number of probes per hop,
      leading to redundant measurements and inefficient use of network resources.
      This research introduces a budget-aware traceroute system (BAT) designed to
      optimize probing efficiency while preserving accurate path discovery. Using
      Scamper as the probing engine, BAT dynamically allocates probe “credits” across
      hops based on per-hop confidence levels. This work highlights the potential
      for adaptive network measurement systems that balance precision, responsiveness,
      and bandwidth efficiency in large-scale Internet topology mapping.
  - title: 'Social Media Misinformation: Trust, Perception, &amp; Public Awareness
      in the Age of AI'
    pdf: sorted_papers/Full-Oral/Student%20-%20Undergraduate/ADMI_2026_paper_5.pdf
    bib: admi2026_bib/Council2026socialmediamisinformatio.bib
    submission_type: Full-Oral
    author_category: Student - Undergraduate
    authors: Kayla Council, Jean Muhammad and Chutima Boonthum-Denecke
    abstract: Misinformation that spreads through social media platforms is becoming
      very important since artificial intelligence (AI) is helping the spread of misinformation.
      A lot of misinformation spreads through manipulated social media posts, and
      this can cause people to reduce their trust in what they see online, and some
      people may even be easily persuaded and believe what they see in these manipulated
      posts. Since artificial intelligence is growing and becoming the newest big
      thing, it’s being used to create posts that are manipulated, and this makes
      it hard for people to distinguish between real and manipulated posts. This research
      will analyze how well people can assess social media posts and what factors
      play a role in their ability to determine what posts are real from the ones
      that are manipulated. A survey was conducted where people had the opportunity
      to choose what post they believe is manipulated, and then they were asked what
      made them choose that choice, and then they rated their confidence level. After
      gathering all of the results from the survey, the results will be compared with
      tools that are already created for being able to detect misinformation that’s
      generated by AI. Comparing the human results from the survey with the detection
      tools will help determine if humans’ ability to spot misinformation is just
      as good as the detection tools. This research will highlight the difficulties
      of spotting misinformation in AI-manipulated posts, and it will also show how
      the cybersecurity side of things can help people continue to trust what they
      see online with the help of detection tools.
  - title: 'Enhancing Black-Box Transparency with SHAP and LIME: A Comparative and
      Practical Review of Explainable AI in Cybersecurity'
    pdf: sorted_papers/Full-Oral/Student%20-%20Undergraduate/ADMI_2026_paper_55.pdf
    bib: admi2026_bib/Ludy2026enhancingblackbox.bib
    submission_type: Full-Oral
    author_category: Student - Undergraduate
    authors: Danae Ludy and Janett Walters-Williams
    abstract: As machine learning models are increasingly deployed in cybersecurity
      systems, their black-box nature complicates trust, accountability, and post-incident
      investigation. Explainable Artificial Intelligence (XAI) addresses these challenges
      by providing human-interpretable insights into model behavior without sacrificing
      predictive performance. Using a standard XAI taxonomy, the paper compares Shapley
      Additive Explanations (SHAP) and Local Interpretable Model-agonistic Explanations
      (LIME) in terms of theoretical grounding, stability, interaction awareness,
      and operational suitability for forensic analysis and intrusion detection. The
      discussion highlights governance and deployment considerations and outlines
      future research directions that integrate complementary visualization techniques
      to strengthen interpretability in cybersecurity workflows. The findings motivate
      a complementary use of SHAP for global oversight and defensible local attribution,
      with LIME applied selectively for rapid case-based analysis.
  - title: Online Anonymity vs. Online Accountability
    pdf: sorted_papers/Full-Oral/Student%20-%20Undergraduate/ADMI_2026_paper_63.pdf
    bib: admi2026_bib/Olds2026onlineanonymityvs.bib
    submission_type: Full-Oral
    author_category: Student - Undergraduate
    authors: Gabrielle Olds and Jean Muhammad
    abstract: The main problem with the conflict between online anonymity and accountability
      is that, although anonymity promotes privacy and free speech, it also makes
      harmful behaviors like trolling and scams possible. In order to understand how
      mandatory identification policies, like requiring government IDs or facial scans
      for site access, affect this balance, this study will review previous research.
      Privacy and security risks will be a major focus because private businesses
      collect extremely sensitive data, increasing the risk of data breaches, long-term
      identity theft, and user tracking. In order to make fair policy decisions, a
      survey will also be carried out to find out how the public feels about these
      intrusive verification techniques.
  - title: 'Feature Effect Visualization in Cybersecurity: A Study of PDP and ICE'
    pdf: sorted_papers/Full-Oral/Student%20-%20Undergraduate/ADMI_2026_paper_66.pdf
    bib: admi2026_bib/Bostic2026featureeffectvisualizati.bib
    submission_type: Full-Oral
    author_category: Student - Undergraduate
    authors: Clarence Bostic and Janet Williams
    abstract: 'The integration of Artificial Intelligence (AI) into cybersecurity
      has significantly developed advanced threat detection and analysis. However,
      due to the deep learning nature, the inherent opacity that comes with these
      “black box” models creates doubts in the decisions of incident investigation.
      Explainable Artificial Intelligence (XAI) is the backbone of the future of this
      transparency gap, by utilizing visualization tools to make these decisions more
      interpretable. This paper examines two feature-visualization tools in cybersecurity:
      Partial Dependence Plots (PDPs) and Individual Conditional Ex- pectation (ICE)
      plots. We analyse the differences between PDPs, which are global explanations,
      by averaging the effects, and ICE plots, which offer local instance-level insights,
      to show heteroge- neous attack patterns. By evaluating these methods with the
      focus of improving cybersecurity intrusion detection and malware anal- ysis.
      This study highlights the necessary balance between clarity and depth to enhance
      operational reliability in AI-driven security systems.'
