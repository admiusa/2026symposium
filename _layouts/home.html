<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: system-ui;
    }

    /* 🔥 NAV AT TOP */
    .nav {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(6px);
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .nav a {
      color: white;
      padding: 1rem 1.2rem;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
    }

    .nav a:hover {
      background: #1e293b;
    }

    .hero {
      position: relative;
      width: 100%;
      height: 420px;
      border-radius: 20px;
      overflow: hidden;

      /* 🔥 THIS IS THE FIX */
      background: 
        linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.75)),
        url('images/ADMI2026_banner.jpg') center/cover no-repeat;

      display: flex;
      align-items: flex-end;
    }

    .hero-overlay {
      width: 100%;
      padding: 2rem;
      background: linear-gradient(to top, rgba(0,0,0,0.65), rgba(0,0,0,0));
      color: white;
    }

    .hero-overlay h1 {
      margin: 0;
      font-size: 2.5rem;
    }

    .hero-overlay p {
      margin: 0.5rem 0 0 0;
      font-size: 1.1rem;
    }

    /* CONTENT */
    .content {
      max-width: 1100px;
      margin: auto;
      padding: 2rem 1.5rem;
    }

    @media (max-width: 700px) {
      .hero {
        height: 300px;
      }

      .nav a {
        padding: 0.8rem;
        font-size: 0.9rem;
      }
    }
  </style>
</head>

<body>

  <!-- 🔥 NAV AT VERY TOP -->
  <div class="nav">
    <a href="/2026symposium/">Home</a>
    <a href="/2026symposium/admi26_president_letter">President</a>
    <a href="/2026symposium/admi26_speakers">Speakers</a>
    <a href="/2026symposium/admi26_sponsors">Sponsors</a>
    <a href="/2026symposium/admi26_papers">Papers</a>
  </div>

  <!-- HERO -->
  <div class="hero">
    <div class="hero-overlay">
      <h1>ADMI Symposium 2026</h1>
      <p>Leveraging Artificial Intelligence in Learning, Teaching, and Research</p>
    </div>
  </div>

  <!-- CONTENT -->
  <div class="content">
    {{ content }}
  </div>

</body>
</html>
