<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: system-ui;
    }

    /* 🔥 NAV AT TOP */
    .nav {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(6px);
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .nav a {
      color: white;
      padding: 1rem 1.2rem;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
    }

    .nav a:hover {
      background: #1e293b;
    }

    .hero {
      position: relative;
      width: 100%;
      height: 420px;
      border-radius: 20px;
      overflow: hidden;

      /* 🔥 THIS IS THE FIX */
      background: 
        linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.75)),
        url('Background_Image_only.png') top center/cover no-repeat;

      display: flex;
      align-items: flex-end;
    }

    .hero-overlay {
      width: 100%;
      padding: 2rem;
      background: linear-gradient(to top, rgba(0,0,0,0.65), rgba(0,0,0,0));
      color: white;
    }

    .hero-overlay h1 {
      margin: 0;
      font-size: 2.5rem;
    }

    .hero-overlay p {
      margin: 0.5rem 0 0 0;
      font-size: 1.1rem;
    }

    /* CONTENT */
    .content {
      max-width: 1100px;
      margin: auto;
      padding: 2rem 1.5rem;
    }

    @media (max-width: 700px) {
      .hero {
        height: 300px;
      }

      .nav a {
        padding: 0.8rem;
        font-size: 0.9rem;
      }
    }

    .site-footer {
      max-width: 1100px;
      margin: 2.5rem auto 0 auto;
      padding: 1.75rem 1.5rem 1.25rem 1.5rem;
      border-top: 1px solid #e5e7eb;
      font-size: 0.95rem;
      line-height: 1.5;
      color: #6b7280;
    }

    .site-footer-inner {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 1rem 1.25rem;
      flex-wrap: wrap;
      text-align: center;
    }

    .site-footer-logo {
      flex-shrink: 0;
      display: block;
      margin: 0;
      height: auto;
      width: auto;
      max-height: 3em;
      max-width: 100%;
      object-fit: contain;
      object-position: center;
    }

    .site-footer-copy {
      flex: 0 1 auto;
      max-width: 42rem;
      text-align: center;
    }

    .site-footer-copy .footer-note {
      margin: 0;
    }

    .site-footer-copy .footer-note + .footer-note {
      margin-top: 0.35rem;
    }

    .site-footer-copy a {
      color: #0969da;
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .site-footer-copy a:hover {
      color: #0550ae;
    }
  </style>
</head>

<body>

  <!-- 🔥 NAV AT VERY TOP -->
  <div class="nav">
    <a href="/2026symposium/">Home</a>
    <a href="/2026symposium/admi26_president_letter">President</a>
    <a href="/2026symposium/admi26_program">Schedule</a>
    <a href="/2026symposium/admi26_speakers">Speakers</a>
    <a href="/2026symposium/admi26_sponsors">Sponsors</a>
    <a href="/2026symposium/admi26_papers">Papers</a>
  </div>

  

  <!-- CONTENT -->
  <div class="content">
    {{ content }}
  </div>

  {% include site-footer.html %}

</body>
</html>
