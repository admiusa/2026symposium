<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --border: #d0d7de;
      --text: #111827;
      --muted: #4b5563;
      --link: #0969da;
      --nav-bg: #0f172a;
      --nav-text: #f8fafc;
      --nav-hover: #1e293b;
      --content-max: 1100px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background: #ffffff;
    }

    .site-header {
      width: 100%;
      overflow: hidden;
      line-height: 0;
      border-bottom: 1px solid var(--border);
    }

    .site-header img {
      width: 100%;
      height: auto;
      display: block;
    }

    .site-nav {
      background: var(--nav-bg);
      border-bottom: 1px solid #0b1220;
    }

    .site-nav-inner {
      max-width: var(--content-max);
      margin: 0 auto;
      padding: 0 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
    }

    .site-nav a {
      display: inline-block;
      color: var(--nav-text);
      text-decoration: none;
      padding: 0.95rem 0.9rem;
      font-size: 0.96rem;
      line-height: 1;
      border-radius: 8px;
      margin: 0.35rem 0;
    }

    .site-nav a:hover {
      background: var(--nav-hover);
    }

    .site-nav a.active {
      background: #1d4ed8;
    }

    .content {
      max-width: var(--content-max);
      margin: 0 auto;
      padding: 1.5rem 1rem 2.5rem 1rem;
    }

    .page-title {
      margin: 0 0 1.25rem 0;
    }

    @media (max-width: 720px) {
      .site-nav-inner {
        gap: 0.25rem;
      }

      .site-nav a {
        padding: 0.8rem 0.75rem;
        font-size: 0.92rem;
      }

      .content {
        padding-top: 1.1rem;
      }
    }
  </style>
</head>
<body>

  <div class="site-header">
    <img src="Text_with_ADMI_logo_background_header.png" alt="ADMI Symposium 2026">
  </div>

  <nav class="site-nav">
    <div class="site-nav-inner">
      <a href="/2026symposium/" {% if page.url == "/" or page.url == "/index.html" %}class="active"{% endif %}>Home</a>
      <a href="/2026symposium/admi26_president_letter" {% if page.url contains "admi26_president_letter" %}class="active"{% endif %}>President’s Letter</a>
      <a href="/2026symposium/admi26_program" {% if page.url contains "admi26_program" %}class="active"{% endif %}>Schedule</a>
      <a href="/2026symposium/admi26_speakers" {% if page.url contains "admi26_speakers" %}class="active"{% endif %}>Speakers</a>
      <a href="/2026symposium/admi26_sponsors" {% if page.url contains "admi26_sponsors" %}class="active"{% endif %}>Sponsors</a>
      <a href="/2026symposium/admi26_papers" {% if page.url contains "admi26_papers" or page.url contains "README" %}class="active"{% endif %}>Papers &amp; Posters</a>
    </div>
  </nav>

  <main class="content">
    {{ content }}
  </main>

</body>
</html>
