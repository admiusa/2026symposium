<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --border: #d0d7de;
      --text: #111827;
      --muted: #4b5563;
      --link: #0969da;
      --nav-bg: #0f172a;
      --nav-text: #f8fafc;
      --nav-hover: #1e293b;
      --content-max: 1100px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background: #ffffff;
    }

    .site-header {
      width: 100%;
      border-bottom: 1px solid var(--border);
    }

    .site-header-inner {
      position: relative;
      max-height: min(300px, 36vh);
      min-height: 140px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
    }

    .site-header-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 28%;
      display: block;
    }

    .site-header-overlay {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: var(--content-max);
      margin: 0 auto;
      padding: 0.85rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .site-header-logo {
      max-width: min(88%, 680px);
      width: auto;
      height: auto;
      max-height: min(128px, 18vh);
      display: block;
      filter: drop-shadow(0 2px 10px rgba(0, 0, 0, 0.45))
        drop-shadow(0 0 2px rgba(0, 0, 0, 0.6));
      pointer-events: auto;
    }

    @media (max-width: 720px) {
      .site-header-inner {
        max-height: min(220px, 32vh);
        min-height: 120px;
      }
      .site-header-logo {
        max-width: min(94%, 100%);
        max-height: min(96px, 15vh);
      }
    }

    .site-nav {
      background: var(--nav-bg);
      border-bottom: 1px solid #0b1220;
    }

    .site-nav-inner {
      max-width: var(--content-max);
      margin: 0 auto;
      padding: 0 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
    }

    .site-nav a {
      display: inline-block;
      color: var(--nav-text);
      text-decoration: none;
      padding: 0.95rem 0.9rem;
      font-size: 0.96rem;
      line-height: 1;
      border-radius: 8px;
      margin: 0.35rem 0;
    }

    .site-nav a:hover {
      background: var(--nav-hover);
    }

    .site-nav a.active {
      background: #1d4ed8;
    }

    .content {
      max-width: var(--content-max);
      margin: 0 auto;
      padding: 1.5rem 1rem 2.5rem 1rem;
    }

    .page-title {
      margin: 0 0 1.25rem 0;
    }

    @media (max-width: 720px) {
      .site-nav-inner {
        gap: 0.25rem;
      }

      .site-nav a {
        padding: 0.8rem 0.75rem;
        font-size: 0.92rem;
      }

      .content {
        padding-top: 1.1rem;
      }
    }

    .site-footer {
      max-width: var(--content-max);
      margin: 2.5rem auto 0 auto;
      padding: 1.75rem 1rem 1.25rem 1rem;
      border-top: 1px solid var(--border);
      font-size: 0.95rem;
      line-height: 1.5;
      color: var(--muted);
    }

    .site-footer-inner {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 1rem 1.25rem;
      flex-wrap: wrap;
      text-align: center;
    }

    .site-footer-logo {
      flex-shrink: 0;
      display: block;
      margin: 0;
      height: auto;
      width: auto;
      max-height: 3em;
      max-width: 100%;
      object-fit: contain;
      object-position: center;
    }

    .site-footer-copy {
      flex: 0 1 auto;
      max-width: 42rem;
      text-align: center;
    }

    .site-footer-copy .footer-note {
      margin: 0;
    }

    .site-footer-copy .footer-note + .footer-note {
      margin-top: 0.35rem;
    }

    .site-footer-copy a {
      color: var(--link);
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .site-footer-copy a:hover {
      color: #0550ae;
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="site-header-inner">
      <img class="site-header-bg" src="{{ '/images/hero-background.png' | relative_url }}" alt="" width="1600" height="600" decoding="async" fetchpriority="high">
      <div class="site-header-overlay">
        <img class="site-header-logo" src="{{ '/images/ADMI-Logo-Header.svg' | relative_url }}" alt="ADMI Symposium 2026" width="1159" height="291" decoding="async">
      </div>
    </div>
  </header>

  <nav class="site-nav">
    <div class="site-nav-inner">
      <a href="/2026symposium/" {% if page.url == "/" or page.url == "/index.html" %}class="active"{% endif %}>Home</a>
      <a href="/2026symposium/admi26_president_letter" {% if page.url contains "admi26_president_letter" %}class="active"{% endif %}>President’s Letter</a>
      <a href="/2026symposium/admi26_program" {% if page.url contains "admi26_program" %}class="active"{% endif %}>Schedule</a>
      <a href="/2026symposium/admi26_speakers" {% if page.url contains "admi26_speakers" %}class="active"{% endif %}>Speakers</a>
      <a href="/2026symposium/admi26_sponsors" {% if page.url contains "admi26_sponsors" %}class="active"{% endif %}>Sponsors</a>
      <a href="/2026symposium/admi26_papers" {% if page.url contains "admi26_papers" or page.url contains "README" %}class="active"{% endif %}>Papers &amp; Posters</a>
    </div>
  </nav>

  <main class="content">
    {{ content }}
  </main>

  {% include site-footer.html %}

</body>
</html>
